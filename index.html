<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我們的旅行手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;700&family=Gloock&family=Noto+Serif+TC:wght@300;400;500;600;700&family=Shadows+Into+Light&display=swap" rel="stylesheet">
<style>
  :root {
    --pea: #E8879E;
    --pea-dark: #C4527A;
    --pea-light: #F5C2CE;
    --cream: #F5EFE0;
    --cream-dark: #EDE4CC;
    --paper: #FBF7EC;
    --rose: #C97A6E;
    --rose-dark: #A45448;
    --coffee: #3D2E1F;
    --coffee-light: #6B5640;
    --tape: rgba(201, 122, 110, 0.35);
    --tape-green: rgba(232, 135, 158, 0.35);
    --hand-display: 'Caveat', cursive;
    --hand-loose: 'Shadows Into Light', cursive;
    --serif-display: 'Gloock', serif;
    --body: 'Noto Serif TC', serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; }
  body {
    font-family: var(--body);
    color: var(--coffee);
    background: var(--cream);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(232, 135, 158, 0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(201, 122, 110, 0.06) 0%, transparent 50%),
      url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
    min-height: 100vh;
    line-height: 1.7;
    font-size: 15px;
  }
  .phone-frame {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--paper);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    position: relative;
    box-shadow: 0 0 60px rgba(61, 46, 31, 0.15);
    padding-bottom: 60px;
  }
  .phone-frame::before {
    content: '';
    position: absolute;
    left: 14px; top: 60px; bottom: 60px;
    width: 1px;
    background: repeating-linear-gradient(to bottom, transparent 0px, transparent 18px, var(--rose) 18px, var(--rose) 20px);
    opacity: 0.18;
    pointer-events: none;
  }

  .top-bar {
    padding: 28px 20px 16px;
    text-align: center;
  }
  .top-bar h1 {
    font-family: var(--hand-display);
    font-size: 36px; font-weight: 700;
    color: var(--pea-dark);
    line-height: 1; letter-spacing: 0.5px;
    transform: rotate(-1.5deg);
    display: inline-block;
  }
  .top-bar .subtitle {
    font-family: var(--hand-loose);
    font-size: 13px; color: var(--coffee-light);
    margin-top: 6px; letter-spacing: 2px;
  }

  .tabs {
    display: flex; justify-content: center; gap: 4px;
    padding: 0 20px 14px;
    border-bottom: 1.5px dashed var(--pea-light);
  }
  .tab-btn {
    background: none; border: none;
    padding: 8px 16px;
    font-family: var(--body);
    font-size: 13px; font-weight: 500;
    color: var(--coffee-light);
    cursor: pointer;
    border-radius: 16px;
    transition: all 0.3s ease;
  }
  .tab-btn.active {
    color: var(--paper); background: var(--pea-dark);
    box-shadow: 2px 2px 0 var(--coffee);
    transform: rotate(-1deg);
  }

  .page {
    display: none;
    padding: 20px 24px 30px;
    animation: fadeIn 0.4s ease;
  }
  .page.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ============ 首頁 ============ */
  .welcome-card {
    background: var(--paper);
    border: 2px solid var(--coffee);
    border-radius: 4px;
    padding: 24px 20px;
    margin-bottom: 24px;
    position: relative;
    box-shadow: 4px 4px 0 var(--pea-dark);
    transform: rotate(-0.8deg);
  }
  .welcome-card::before {
    content: '';
    position: absolute;
    top: -12px; left: 50%;
    transform: translateX(-50%) rotate(-3deg);
    width: 80px; height: 22px;
    background: var(--tape);
    border-radius: 1px;
  }
  .welcome-card h2 {
    font-family: var(--hand-display);
    font-size: 28px; color: var(--coffee);
    margin-bottom: 6px;
  }
  .welcome-card .greeting {
    font-family: var(--hand-loose);
    color: var(--rose); font-size: 14px;
    letter-spacing: 1px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-bottom: 30px;
  }
  .stat-card {
    background: var(--cream);
    border: 1.5px solid var(--coffee);
    border-radius: 4px;
    padding: 14px 8px;
    text-align: center;
  }
  .stat-card:nth-child(2) { transform: rotate(1deg); background: var(--pea-light); }
  .stat-card:nth-child(3) { transform: rotate(-1deg); }
  .stat-num {
    font-family: var(--serif-display);
    font-size: 32px; color: var(--pea-dark);
    line-height: 1; display: block;
  }
  .stat-label {
    font-family: var(--hand-display);
    font-size: 14px; color: var(--coffee-light);
    margin-top: 4px;
  }

  .section-title {
    font-family: var(--hand-display);
    font-size: 24px; color: var(--coffee);
    margin: 24px 0 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-title::before {
    content: ''; width: 28px; height: 2px;
    background: var(--rose);
  }
  .section-title::after {
    content: ''; flex: 1; height: 1.5px;
    background: repeating-linear-gradient(to right, var(--coffee-light) 0, var(--coffee-light) 3px, transparent 3px, transparent 7px);
    opacity: 0.4;
  }

  .trip-card {
    background: var(--paper);
    border: 2px solid var(--coffee);
    border-radius: 4px;
    padding: 18px;
    margin-bottom: 18px;
    cursor: pointer;
    position: relative;
    transition: all 0.3s ease;
    box-shadow: 3px 3px 0 var(--coffee-light);
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .trip-card:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 var(--coffee-light);
  }
  .trip-card::before {
    content: '';
    position: absolute;
    top: -10px; right: 20px;
    width: 60px; height: 20px;
    background: var(--tape-green);
    border-radius: 1px;
    transform: rotate(4deg);
  }
  .trip-card .stamp {
    position: absolute;
    top: 10px; right: 12px;
    font-family: var(--hand-display);
    font-size: 11px; color: var(--rose-dark);
    border: 1.5px solid var(--rose-dark);
    padding: 2px 8px; border-radius: 2px;
    transform: rotate(8deg);
    background: rgba(251, 247, 236, 0.8);
    letter-spacing: 1px;
  }
  .trip-card .stamp.planning {
    color: var(--pea-dark);
    border-color: var(--pea-dark);
  }
  .trip-card h3 {
    font-family: var(--hand-display);
    font-size: 26px; color: var(--coffee);
    line-height: 1.1; margin-bottom: 6px;
    padding-right: 70px;
  }
  .trip-card .trip-date {
    font-family: var(--body); font-size: 12px;
    color: var(--coffee-light);
    margin-bottom: 12px; letter-spacing: 1px;
  }
  .trip-card .trip-meta {
    display: flex; gap: 6px;
    flex-wrap: wrap; margin-top: 10px;
  }
  .meta-tag {
    background: var(--cream);
    border: 1px solid var(--coffee-light);
    padding: 3px 9px;
    font-family: var(--hand-display);
    font-size: 13px; color: var(--coffee);
    border-radius: 12px;
  }
  .meta-tag.green {
    background: var(--pea-light);
    border-color: var(--pea-dark);
    color: var(--pea-dark);
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    background: var(--cream);
    border: 1.5px dashed var(--coffee-light);
    border-radius: 6px;
    margin: 20px 0;
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
  .empty-state h4 {
    font-family: var(--hand-display);
    font-size: 22px; color: var(--coffee-light);
    margin-bottom: 6px;
  }
  .empty-state p { font-size: 13px; color: var(--coffee-light); line-height: 1.6; }

  /* ============ 行事曆 ============ */
  .calendar-header {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 16px;
  }
  .calendar-nav {
    background: none;
    border: 1.5px solid var(--coffee);
    width: 36px; height: 36px;
    border-radius: 50%;
    color: var(--coffee); font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .calendar-nav:active { background: var(--pea-light); }
  .month-title {
    font-family: var(--hand-display);
    font-size: 30px; color: var(--coffee);
    transform: rotate(-1deg);
    text-align: center;
    line-height: 1;
  }
  .month-title .year {
    font-family: var(--body); font-size: 13px;
    color: var(--coffee-light); display: block;
    text-align: center; letter-spacing: 2px;
    margin-top: 2px;
  }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px; margin-bottom: 10px;
  }
  .weekdays div {
    text-align: center;
    font-family: var(--hand-display);
    font-size: 15px; color: var(--rose-dark);
    padding: 6px 0;
  }
  .weekdays div:first-child, .weekdays div:last-child {
    color: var(--rose); font-weight: 700;
  }

  .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }

  /* 普通日期格 - 不可點 */
  .day-cell {
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--body); font-size: 14px;
    color: var(--coffee-light);
    border-radius: 4px;
    position: relative;
    background: transparent;
    border: 1px dashed transparent;
  }
  .day-cell.other-month { color: var(--coffee-light); opacity: 0.25; }
  .day-cell.today {
    border: 2px solid var(--rose);
    color: var(--rose);
    font-weight: 700;
  }

  /* 🎯 有活動的日期 = 變成按鈕 */
  .day-button {
    aspect-ratio: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: var(--body); font-size: 14px;
    color: var(--paper);
    background: var(--pea-dark);
    border: 2px solid var(--coffee);
    border-radius: 6px;
    position: relative;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 2px 2px 0 var(--coffee);
    transition: all 0.15s ease;
    font-weight: 700;
    overflow: hidden;
  }
  .day-button:hover {
    background: var(--pea);
    transform: translate(-1px, -1px);
    box-shadow: 3px 3px 0 var(--coffee);
  }
  .day-button:active {
    background: var(--pea);
    transform: translate(2px, 2px);
    box-shadow: 0 0 0 var(--coffee);
  }

  /* 按鈕內裝飾：一個小三角告訴使用者「可點」 */
  .day-button::after {
    content: '↗';
    position: absolute;
    top: 2px; right: 4px;
    font-size: 9px;
    opacity: 0.7;
    font-weight: 400;
  }

  /* 旅行開始/結束 - 有特殊邊角 */
  .day-button.trip-start {
    border-left: 4px solid var(--rose);
    border-radius: 4px 12px 12px 4px;
  }
  .day-button.trip-end {
    border-right: 4px solid var(--rose);
    border-radius: 12px 4px 4px 12px;
  }
  .day-button.trip-start.trip-end {
    border-left: 4px solid var(--rose);
    border-right: 4px solid var(--rose);
    border-radius: 12px;
  }

  .day-button.today {
    box-shadow: 2px 2px 0 var(--coffee), 0 0 0 2px var(--rose) inset;
  }

  /* 旅行迷你標籤（行事曆下方） */
  .month-trips-list {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1.5px dashed var(--pea-light);
  }
  .month-trips-title {
    font-family: var(--hand-display);
    font-size: 20px;
    color: var(--coffee);
    margin-bottom: 12px;
  }
  .mini-trip-link {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: var(--cream);
    border: 1.5px solid var(--coffee);
    border-radius: 4px;
    margin-bottom: 10px;
    text-decoration: none;
    color: inherit;
    transition: all 0.2s;
    box-shadow: 2px 2px 0 var(--coffee-light);
  }
  .mini-trip-link:active {
    transform: translate(2px, 2px);
    box-shadow: 0 0 0 var(--coffee-light);
  }
  .mini-trip-link .date-block {
    flex-shrink: 0;
    background: var(--pea-dark);
    color: var(--paper);
    padding: 6px 10px;
    border-radius: 4px;
    font-family: var(--hand-display);
    font-size: 16px;
    line-height: 1;
    text-align: center;
    min-width: 56px;
  }
  .mini-trip-link .info {
    flex: 1;
    min-width: 0;
  }
  .mini-trip-link .info-title {
    font-family: var(--body);
    font-weight: 600;
    color: var(--coffee);
    font-size: 14px;
    margin-bottom: 2px;
  }
  .mini-trip-link .info-meta {
    font-size: 11px;
    color: var(--coffee-light);
  }
  .mini-trip-link .arrow {
    color: var(--rose);
    font-family: var(--hand-display);
    font-size: 22px;
    flex-shrink: 0;
  }

  .empty-month {
    text-align: center;
    padding: 24px 20px;
    color: var(--coffee-light);
    font-family: var(--hand-display);
    font-size: 18px;
  }
  .empty-month .hint {
    font-size: 12px;
    font-family: var(--body);
    margin-top: 4px;
    opacity: 0.7;
  }

  .footer-note {
    text-align: center;
    padding: 30px 20px 20px;
    font-family: var(--hand-loose);
    font-size: 13px; color: var(--coffee-light);
    letter-spacing: 1px;
  }
  .footer-note::before, .footer-note::after { content: '✦'; color: var(--rose); margin: 0 8px; }

  .error-box {
    background: rgba(201, 122, 110, 0.1);
    border: 1.5px solid var(--rose);
    border-radius: 4px;
    padding: 14px;
    margin: 16px 0;
    font-size: 13px;
    color: var(--rose-dark);
    line-height: 1.6;
  }
  .error-box strong { display: block; margin-bottom: 4px; font-family: var(--hand-display); font-size: 18px; }
  .error-box code {
    background: var(--paper);
    padding: 1px 5px;
    border-radius: 3px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px;
  }

  /* ============ 回憶相簿 photo strip ============ */
  .album-block { margin-bottom: 28px; }
  .album-trip-label {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 10px;
  }
  .album-trip-name {
    font-family: var(--hand-display);
    font-size: 18px;
    color: var(--coffee);
  }
  .album-trip-date {
    font-family: var(--body);
    font-size: 11px;
    color: var(--coffee-light);
    letter-spacing: 0.5px;
  }
  .strip-outer {
    margin: 0 -24px;
    padding: 8px 24px 14px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .strip-outer::-webkit-scrollbar { display: none; }
  .strip-inner {
    display: flex;
    gap: 14px;
    align-items: flex-end;
    width: max-content;
    padding-bottom: 4px;
  }
  .mini-polaroid {
    flex-shrink: 0;
    background: #fff;
    padding: 5px 5px 22px;
    box-shadow: 1px 3px 10px rgba(0,0,0,0.18), 0 0 0 0.5px rgba(0,0,0,0.06);
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    touch-action: manipulation;
  }
  .mini-polaroid:nth-child(3n+1) { transform: rotate(-2.5deg) translateY(2px); }
  .mini-polaroid:nth-child(3n+2) { transform: rotate(2deg); }
  .mini-polaroid:nth-child(3n)   { transform: rotate(-0.8deg) translateY(-2px); }
  .mini-polaroid:active { transform: scale(0.92) rotate(0deg) !important; box-shadow: 1px 1px 4px rgba(0,0,0,0.12) !important; }
  .mini-polaroid img {
    display: block;
    width: 88px;
    height: 88px;
    object-fit: cover;
    background: var(--cream-dark);
  }
  .mini-polaroid-caption {
    font-family: var(--hand-display);
    font-size: 11px;
    color: #888;
    text-align: center;
    padding-top: 5px;
    height: 14px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    max-width: 88px;
  }

  /* lightbox */
  .ix-lightbox {
    display: none;
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.9);
    align-items: center; justify-content: center;
  }
  .ix-lightbox.open { display: flex; }
  .ix-lightbox img { max-width: 92%; max-height: 88vh; border-radius: 4px; object-fit: contain; }
  .ix-lightbox-caption {
    position: absolute;
    bottom: 28px; left: 50%;
    transform: translateX(-50%);
    font-family: var(--hand-display);
    font-size: 18px;
    color: rgba(255,255,255,0.75);
    white-space: nowrap;
  }
  .ix-close {
    position: absolute; top: 16px; right: 20px;
    font-size: 28px; color: white;
    background: none; border: none; cursor: pointer;
    line-height: 1;
  }

  /* ============ 查詢 ============ */
  .search-chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .chip {
    background: none;
    border: 1.5px solid var(--coffee);
    border-radius: 20px;
    padding: 8px 18px;
    font-family: var(--hand-display);
    font-size: 15px;
    color: var(--coffee);
    cursor: pointer;
    transition: all 0.2s;
  }
  .chip.active {
    background: var(--pea-dark);
    color: var(--paper);
    border-color: var(--pea-dark);
    box-shadow: 2px 2px 0 var(--coffee);
    transform: rotate(-1deg);
  }
  .chip:active { transform: translate(1px, 1px) !important; }
  .search-count {
    font-family: var(--hand-display);
    font-size: 14px;
    color: var(--coffee-light);
    margin-bottom: 18px;
    padding-left: 2px;
  }
  .spot-result-card {
    background: var(--paper);
    border: 1.5px solid var(--coffee);
    border-radius: 4px;
    padding: 14px;
    margin-bottom: 12px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    box-shadow: 2px 2px 0 var(--coffee-light);
    text-decoration: none;
    color: inherit;
    position: relative;
    transition: all 0.15s;
  }
  .spot-result-card:active {
    transform: translate(2px, 2px);
    box-shadow: 0 0 0 var(--coffee-light);
  }
  .spot-result-emoji {
    font-size: 26px;
    width: 46px; height: 46px;
    display: flex; align-items: center; justify-content: center;
    background: var(--cream);
    border: 1px solid var(--cream-dark);
    border-radius: 8px;
    flex-shrink: 0;
  }
  .spot-result-body { flex: 1; min-width: 0; }
  .spot-result-name {
    font-family: var(--body);
    font-weight: 600;
    font-size: 14px;
    color: var(--coffee);
    margin-bottom: 3px;
  }
  .spot-result-desc {
    font-size: 12px;
    color: var(--coffee-light);
    line-height: 1.5;
    margin-bottom: 5px;
  }
  .spot-result-trip {
    font-family: var(--hand-display);
    font-size: 12px;
    color: var(--rose-dark);
  }
  .spot-cat-badge {
    position: absolute;
    top: 8px; right: 10px;
    font-family: var(--hand-display);
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 10px;
    border: 1px solid;
    white-space: nowrap;
  }
  .spot-cat-badge.食物 { background: #FDF3E7; color: #8C5A1A; border-color: rgba(212,136,60,0.35); }
  .spot-cat-badge.室內景點 { background: #EEF0F8; color: #4A4F8C; border-color: rgba(74,79,140,0.3); }
  .spot-cat-badge.室外景點 { background: #EEF4E3; color: #5E7338; border-color: rgba(94,115,56,0.3); }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="top-bar">
    <h1>我們的旅行手帳</h1>
    <div class="subtitle">our little adventures</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="home">首頁</button>
    <button class="tab-btn" data-tab="calendar">行事曆</button>
    <button class="tab-btn" data-tab="search">查詢</button>
  </div>

  <!-- 首頁 -->
  <div id="page-home" class="page active">
    <div class="welcome-card">
      <h2>Happy與Lucky約會記錄</h2>
      <div class="greeting">welcome back to your journal</div>
    </div>

    <div class="stats-grid" id="stats-grid"></div>

    <div class="section-title">即將出發</div>
    <div id="upcoming-trips"></div>

    <div class="section-title">過往旅行</div>
    <div id="past-trips-list"></div>

    <div class="section-title">回憶相簿</div>
    <div id="past-trips"></div>
  </div>

  <!-- 行事曆 -->
  <div id="page-calendar" class="page">
    <div class="calendar-header">
      <button class="calendar-nav" id="prev-month">‹</button>
      <div class="month-title">
        <span id="month-name"></span>
        <span class="year" id="year-name"></span>
      </div>
      <button class="calendar-nav" id="next-month">›</button>
    </div>

    <div class="weekdays">
      <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
    </div>
    <div class="days-grid" id="days-grid"></div>

    <!-- 本月有的旅行清單 -->
    <div class="month-trips-list">
      <div class="month-trips-title" id="month-trips-title">本月旅行</div>
      <div id="month-trips-list"></div>
    </div>
  </div>

  <!-- 查詢 -->
  <div id="page-search" class="page">
    <div class="section-title">快速查詢</div>
    <div class="search-chips">
      <button class="chip active" data-cat="all">全部</button>
      <button class="chip" data-cat="食物">🍜 食物</button>
      <button class="chip" data-cat="室內景點">🏛️ 室內景點</button>
      <button class="chip" data-cat="室外景點">🌿 室外景點</button>
    </div>
    <div class="search-count" id="search-count"></div>
    <div id="search-results"></div>
  </div>

  <div class="footer-note">made with care</div>
</div>

<!-- lightbox -->
<div id="ix-lightbox" class="ix-lightbox">
  <button class="ix-close" id="ix-close">✕</button>
  <img id="ix-img" src="" alt="">
  <div class="ix-lightbox-caption" id="ix-caption"></div>
</div>

<script>
// ============================================
// 旅行手帳主程式
// 行事曆：有活動的日期 = 跳轉按鈕
// ============================================

let TRIPS = [];
let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();
const today = new Date();
const MONTH_NAMES = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

async function bootstrap() {
  try {
    const res = await fetch('trips.json');
    if (!res.ok) throw new Error('trips.json 載入失敗');
    const data = await res.json();
    TRIPS = data.trips || [];

    renderHome();
    renderSearch();

    // 跳到第一個有旅行的月份（如果有的話）
    if (TRIPS.length > 0) {
      const firstTrip = new Date(TRIPS[0].startDate);
      currentMonth = firstTrip.getMonth();
      currentYear = firstTrip.getFullYear();
    }
    renderCalendar();
  } catch (err) {
    console.error(err);
    showLoadError(err.message);
  }
}

function showLoadError(msg) {
  document.getElementById('upcoming-trips').innerHTML = `
    <div class="error-box">
      <strong>哎呀，載入失敗了</strong>
      <p>${msg}</p>
      <p style="margin-top:8px">如果你是直接打開檔案（file://），瀏覽器會阻擋讀取 JSON。</p>
      <p style="margin-top:8px"><strong style="display:inline">解法</strong>：部署到 GitHub Pages，或本地用 <code>python3 -m http.server</code></p>
    </div>`;
}

// 分頁切換
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('page-' + tab).classList.add('active');
    window.scrollTo(0, 0);
  });
});

// ============ 首頁 ============
function renderHome() {
  const totalTrips = TRIPS.length;
  const totalDays = TRIPS.reduce((sum, t) => {
    const s = new Date(t.startDate);
    const e = new Date(t.endDate);
    return sum + Math.ceil((e - s) / 86400000) + 1;
  }, 0);
  const totalPlaces = new Set(TRIPS.map(t => t.destination)).size;

  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card"><span class="stat-num">${totalTrips}</span><span class="stat-label">趟旅行</span></div>
    <div class="stat-card"><span class="stat-num">${totalDays}</span><span class="stat-label">天足跡</span></div>
    <div class="stat-card"><span class="stat-num">${totalPlaces}</span><span class="stat-label">個地方</span></div>
  `;

  const upcoming   = TRIPS.filter(t => t.status === 'planning');
  const past       = TRIPS.filter(t => t.status === 'done');
  const withPhotos = TRIPS.filter(t => t.photos && t.photos.length > 0);

  document.getElementById('upcoming-trips').innerHTML = upcoming.length
    ? upcoming.map(renderTripCard).join('')
    : `<div class="empty-state"><div class="icon">✿</div><h4>還沒有規劃中的旅行</h4><p>新的目的地等著我們呢</p></div>`;

  document.getElementById('past-trips-list').innerHTML = past.length
    ? past.map(renderPastRow).join('')
    : `<div class="empty-state"><div class="icon">🗺️</div><h4>還沒有過往旅行</h4><p>旅行結束後把 status 改成 done</p></div>`;

  document.getElementById('past-trips').innerHTML = withPhotos.length
    ? withPhotos.map(renderAlbumBlock).join('')
    : `<div class="empty-state"><div class="icon">📷</div><h4>還沒有回憶</h4><p>旅行結束後把照片加進來吧</p></div>`;
}

function renderPastRow(trip) {
  const s = new Date(trip.startDate);
  const e = new Date(trip.endDate);
  const sameDay = trip.startDate === trip.endDate;
  const dateText = sameDay
    ? `${s.getMonth()+1}/${s.getDate()}`
    : `${s.getMonth()+1}/${s.getDate()}–${e.getDate()}`;
  return `
    <a class="mini-trip-link" href="${trip.file}">
      <div class="date-block">${dateText}</div>
      <div class="info">
        <div class="info-title">${trip.title}</div>
        <div class="info-meta">${trip.destination} · ${trip.people}人</div>
      </div>
      <div class="arrow">→</div>
    </a>`;
}

function renderAlbumBlock(trip) {
  const items = (trip.photos || []).map((p, i) => `
    <div class="mini-polaroid" onclick="openIxLightbox('${p.src}','${p.caption}')">
      <img src="${p.src}" alt="${p.caption}" loading="lazy">
      <div class="mini-polaroid-caption">${p.caption}</div>
    </div>`).join('');

  return `
    <div class="album-block">
      <div class="album-trip-label">
        <span class="album-trip-name">${trip.title}</span>
        <span class="album-trip-date">${formatDateRange(trip.startDate, trip.endDate)}</span>
      </div>
      <div class="strip-outer">
        <div class="strip-inner">${items}</div>
      </div>
    </div>`;
}

// lightbox
function openIxLightbox(src, caption) {
  document.getElementById('ix-img').src = src;
  document.getElementById('ix-caption').textContent = caption || '';
  document.getElementById('ix-lightbox').classList.add('open');
}
document.getElementById('ix-close').addEventListener('click', () => {
  document.getElementById('ix-lightbox').classList.remove('open');
});
document.getElementById('ix-lightbox').addEventListener('click', e => {
  if (e.target === document.getElementById('ix-lightbox'))
    document.getElementById('ix-lightbox').classList.remove('open');
});

function renderTripCard(trip) {
  const statusText = trip.status === 'planning' ? '計畫中' : '完成';
  return `
    <a class="trip-card" href="${trip.file}">
      <div class="stamp ${trip.status}">${statusText}</div>
      <h3>${trip.title}</h3>
      <div class="trip-date">${formatDateRange(trip.startDate, trip.endDate)} · ${trip.people}人</div>
      <div class="trip-meta">
        ${(trip.tags || []).map(t => `<span class="meta-tag">${t}</span>`).join('')}
        <span class="meta-tag green">${trip.destination}</span>
      </div>
    </a>
  `;
}

function formatDateRange(start, end) {
  const s = new Date(start);
  const e = new Date(end);
  if (s.getFullYear() === e.getFullYear() && s.getMonth() === e.getMonth()) {
    return `${s.getFullYear()}年${s.getMonth()+1}月${s.getDate()}-${e.getDate()}日`;
  }
  return `${s.getFullYear()}.${s.getMonth()+1}.${s.getDate()} - ${e.getFullYear()}.${e.getMonth()+1}.${e.getDate()}`;
}

// ============ 行事曆 ============
function renderCalendar() {
  document.getElementById('month-name').textContent = MONTH_NAMES[currentMonth];
  document.getElementById('year-name').textContent = currentYear;

  const firstDay = new Date(currentYear, currentMonth, 1);
  const lastDay = new Date(currentYear, currentMonth + 1, 0);
  const startOffset = firstDay.getDay();
  let html = '';

  // 上個月尾巴
  const prevMonthLast = new Date(currentYear, currentMonth, 0).getDate();
  for (let i = startOffset - 1; i >= 0; i--) {
    html += `<div class="day-cell other-month">${prevMonthLast - i}</div>`;
  }

  // 本月日期
  for (let d = 1; d <= lastDay.getDate(); d++) {
    const cellDate = new Date(currentYear, currentMonth, d);
    const dateStr = ymd(cellDate);
    const trip = findTripOnDate(dateStr);
    const isToday = ymd(today) === dateStr;

    if (trip) {
      // 🎯 有活動 → 變成按鈕
      const isStart = trip.startDate === dateStr;
      const isEnd = trip.endDate === dateStr;
      const classes = ['day-button'];
      if (isStart) classes.push('trip-start');
      if (isEnd) classes.push('trip-end');
      if (isToday) classes.push('today');

      html += `<a class="${classes.join(' ')}" href="${trip.file}" title="${trip.title}">${d}</a>`;
    } else {
      // 普通日期 → 不可點
      const classes = ['day-cell'];
      if (isToday) classes.push('today');
      html += `<div class="${classes.join(' ')}">${d}</div>`;
    }
  }

  // 下個月開頭
  const totalCells = startOffset + lastDay.getDate();
  const remainingCells = (7 - totalCells % 7) % 7;
  for (let i = 1; i <= remainingCells; i++) {
    html += `<div class="day-cell other-month">${i}</div>`;
  }

  document.getElementById('days-grid').innerHTML = html;

  // 顯示本月旅行清單
  renderMonthTrips();
}

function renderMonthTrips() {
  const monthTrips = TRIPS.filter(t => {
    const start = new Date(t.startDate);
    const end = new Date(t.endDate);
    // 旅行任何一天落在本月就算
    const monthStart = new Date(currentYear, currentMonth, 1);
    const monthEnd = new Date(currentYear, currentMonth + 1, 0);
    return start <= monthEnd && end >= monthStart;
  });

  const listEl = document.getElementById('month-trips-list');

  if (monthTrips.length === 0) {
    document.getElementById('month-trips-title').textContent = '本月旅行';
    listEl.innerHTML = `
      <div class="empty-month">
        ✿ 本月沒有旅行
        <div class="hint">空白的日子，醞釀著下一場冒險</div>
      </div>
    `;
    return;
  }

  document.getElementById('month-trips-title').textContent = `本月旅行 (${monthTrips.length})`;
  listEl.innerHTML = monthTrips.map(trip => {
    const s = new Date(trip.startDate);
    const e = new Date(trip.endDate);
    const sameDay = trip.startDate === trip.endDate;
    const dateText = sameDay
      ? `${s.getMonth()+1}/${s.getDate()}`
      : `${s.getMonth()+1}/${s.getDate()}-${e.getDate()}`;

    return `
      <a class="mini-trip-link" href="${trip.file}">
        <div class="date-block">${dateText}</div>
        <div class="info">
          <div class="info-title">${trip.title}</div>
          <div class="info-meta">${trip.destination} · ${trip.people}人</div>
        </div>
        <div class="arrow">→</div>
      </a>
    `;
  }).join('');
}

function ymd(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function findTripOnDate(dateStr) {
  return TRIPS.find(t => dateStr >= t.startDate && dateStr <= t.endDate);
}

document.getElementById('prev-month').onclick = () => {
  currentMonth--;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  renderCalendar();
};

document.getElementById('next-month').onclick = () => {
  currentMonth++;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  renderCalendar();
};

// ============ 查詢 ============
let activeCategory = 'all';

function renderSearch() {
  const allSpots = [];
  TRIPS.forEach(trip => {
    (trip.spots || []).forEach(spot => {
      allSpots.push({ ...spot, tripTitle: trip.title, tripFile: trip.file });
    });
  });

  const filtered = activeCategory === 'all'
    ? allSpots
    : allSpots.filter(s => s.category === activeCategory);

  const countEl = document.getElementById('search-count');
  countEl.textContent = activeCategory === 'all'
    ? `共 ${filtered.length} 個地點`
    : `${activeCategory} · ${filtered.length} 個`;

  const container = document.getElementById('search-results');
  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><h4>沒有符合的地點</h4><p>試試其他類別</p></div>`;
    return;
  }

  container.innerHTML = filtered.map(spot => `
    <a class="spot-result-card" href="${spot.tripFile}">
      <div class="spot-result-emoji">${spot.emoji}</div>
      <div class="spot-result-body">
        <div class="spot-result-name">${spot.name}</div>
        <div class="spot-result-desc">${spot.desc}</div>
        <div class="spot-result-trip">📍 ${spot.tripTitle}</div>
      </div>
      <span class="spot-cat-badge ${spot.category}">${spot.category}</span>
    </a>`).join('');
}

document.querySelectorAll('.search-chips .chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.search-chips .chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCategory = btn.dataset.cat;
    renderSearch();
  });
});

// 啟動
bootstrap();
</script>
</body>
</html>
