<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FBF7EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="happy lucky">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<title>我們的旅行手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;700&family=Gloock&family=Noto+Serif+TC:wght@300;400;500;600;700&family=Shadows+Into+Light&display=swap" rel="stylesheet">
<style>
  :root {
    --pea: #E8879E;
    --pea-dark: #C4527A;
    --pea-light: #F5C2CE;
    --cream: #F5EFE0;
    --cream-dark: #EDE4CC;
    --paper: #FBF7EC;
    --rose: #C97A6E;
    --rose-dark: #A45448;
    --coffee: #3D2E1F;
    --coffee-light: #6B5640;
    --tape: rgba(201, 122, 110, 0.35);
    --tape-green: rgba(232, 135, 158, 0.35);
    --hand-display: 'Caveat', cursive;
    --hand-loose: 'Shadows Into Light', cursive;
    --serif-display: 'Gloock', serif;
    --body: 'Noto Serif TC', serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; }
  .pull-refresh-indicator {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: 50%;
    z-index: 1000;
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border: 1px solid var(--cream-dark);
    border-radius: 50%;
    background: var(--paper);
    color: var(--pea-dark);
    box-shadow: 0 3px 12px rgba(61, 46, 31, 0.16);
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -54px);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .pull-refresh-indicator.visible { opacity: 1; }
  .pull-refresh-indicator.ready { color: var(--coffee); }
  .pull-refresh-indicator.loading {
    opacity: 1;
    transform: translate(-50%, 0);
  }
  .pull-refresh-indicator.loading span { animation: pull-refresh-spin 0.7s linear infinite; }
  @keyframes pull-refresh-spin { to { transform: rotate(360deg); } }
  body {
    font-family: var(--body);
    color: var(--coffee);
    background: var(--cream);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(232, 135, 158, 0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(201, 122, 110, 0.06) 0%, transparent 50%),
      url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
    min-height: 100vh;
    line-height: 1.7;
    font-size: 15px;
  }
  .phone-frame {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--paper);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    position: relative;
    box-shadow: 0 0 60px rgba(61, 46, 31, 0.15);
    padding-bottom: 60px;
  }
  .phone-frame::before {
    content: '';
    position: absolute;
    left: 14px; top: 60px; bottom: 60px;
    width: 1px;
    background: repeating-linear-gradient(to bottom, transparent 0px, transparent 18px, var(--rose) 18px, var(--rose) 20px);
    opacity: 0.18;
    pointer-events: none;
  }

  .top-bar {
    padding: 28px 20px 16px;
    text-align: center;
  }
  .top-bar h1 {
    font-family: var(--hand-display);
    font-size: 36px; font-weight: 700;
    color: var(--pea-dark);
    line-height: 1; letter-spacing: 0.5px;
    transform: rotate(-1.5deg);
    display: inline-block;
  }
  .top-bar .subtitle {
    font-family: var(--hand-loose);
    font-size: 13px; color: var(--coffee-light);
    margin-top: 6px; letter-spacing: 2px;
  }

  .tabs {
    display: flex; justify-content: center; gap: 4px;
    padding: 0 20px 14px;
    border-bottom: 1.5px dashed var(--pea-light);
  }
  .tab-btn {
    background: none; border: none;
    padding: 8px 16px;
    font-family: var(--body);
    font-size: 13px; font-weight: 500;
    color: var(--coffee-light);
    cursor: pointer;
    border-radius: 16px;
    transition: all 0.3s ease;
  }
  .tab-btn.active {
    color: var(--paper); background: var(--pea-dark);
    box-shadow: 2px 2px 0 var(--coffee);
    transform: rotate(-1deg);
  }

  .page {
    display: none;
    padding: 20px 24px 30px;
    animation: fadeIn 0.4s ease;
  }
  .page.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ============ 首頁 ============ */
  .welcome-card {
    background: var(--paper);
    border: 2px solid var(--coffee);
    border-radius: 4px;
    padding: 24px 20px;
    margin-bottom: 24px;
    position: relative;
    box-shadow: 4px 4px 0 var(--pea-dark);
    transform: rotate(-0.8deg);
  }
  .welcome-card::before {
    content: '';
    position: absolute;
    top: -12px; left: 50%;
    transform: translateX(-50%) rotate(-3deg);
    width: 80px; height: 22px;
    background: var(--tape);
    border-radius: 1px;
  }
  .welcome-card h2 {
    font-family: var(--hand-display);
    font-size: 28px; color: var(--coffee);
    margin-bottom: 6px;
  }
  .welcome-card .greeting {
    font-family: var(--hand-loose);
    color: var(--rose); font-size: 14px;
    letter-spacing: 1px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-bottom: 30px;
  }
  .stat-card {
    background: var(--cream);
    border: 1.5px solid var(--coffee);
    border-radius: 4px;
    padding: 14px 8px;
    text-align: center;
  }
  .stat-card:nth-child(2) { transform: rotate(1deg); background: var(--pea-light); }
  .stat-card:nth-child(3) { transform: rotate(-1deg); }
  .stat-num {
    font-family: var(--serif-display);
    font-size: 32px; color: var(--pea-dark);
    line-height: 1; display: block;
  }
  .stat-label {
    font-family: var(--hand-display);
    font-size: 14px; color: var(--coffee-light);
    margin-top: 4px;
  }

  .section-title {
    font-family: var(--hand-display);
    font-size: 24px; color: var(--coffee);
    margin: 24px 0 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-title::before {
    content: ''; width: 28px; height: 2px;
    background: var(--rose);
  }
  .section-title::after {
    content: ''; flex: 1; height: 1.5px;
    background: repeating-linear-gradient(to right, var(--coffee-light) 0, var(--coffee-light) 3px, transparent 3px, transparent 7px);
    opacity: 0.4;
  }

  .trip-card {
    background: var(--paper);
    border: 2px solid var(--coffee);
    border-radius: 4px;
    padding: 18px;
    margin-bottom: 18px;
    cursor: pointer;
    position: relative;
    transition: all 0.3s ease;
    box-shadow: 3px 3px 0 var(--coffee-light);
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .trip-card:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 var(--coffee-light);
  }
  .trip-card::before {
    content: '';
    position: absolute;
    top: -10px; right: 20px;
    width: 60px; height: 20px;
    background: var(--tape-green);
    border-radius: 1px;
    transform: rotate(4deg);
  }
  .trip-card .stamp {
    position: absolute;
    top: 10px; right: 12px;
    font-family: var(--hand-display);
    font-size: 11px; color: var(--rose-dark);
    border: 1.5px solid var(--rose-dark);
    padding: 2px 8px; border-radius: 2px;
    transform: rotate(8deg);
    background: rgba(251, 247, 236, 0.8);
    letter-spacing: 1px;
  }
  .trip-card .stamp.planning {
    color: var(--pea-dark);
    border-color: var(--pea-dark);
  }
  .trip-card h3 {
    font-family: var(--hand-display);
    font-size: 26px; color: var(--coffee);
    line-height: 1.1; margin-bottom: 6px;
    padding-right: 70px;
  }
  .trip-card .trip-date {
    font-family: var(--body); font-size: 12px;
    color: var(--coffee-light);
    margin-bottom: 12px; letter-spacing: 1px;
  }
  .trip-card .trip-meta {
    display: flex; gap: 6px;
    flex-wrap: wrap; margin-top: 10px;
  }
  .meta-tag {
    background: var(--cream);
    border: 1px solid var(--coffee-light);
    padding: 3px 9px;
    font-family: var(--hand-display);
    font-size: 13px; color: var(--coffee);
    border-radius: 12px;
  }
  .meta-tag.green {
    background: var(--pea-light);
    border-color: var(--pea-dark);
    color: var(--pea-dark);
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    background: var(--cream);
    border: 1.5px dashed var(--coffee-light);
    border-radius: 6px;
    margin: 20px 0;
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
  .empty-state h4 {
    font-family: var(--hand-display);
    font-size: 22px; color: var(--coffee-light);
    margin-bottom: 6px;
  }
  .empty-state p { font-size: 13px; color: var(--coffee-light); line-height: 1.6; }

  /* ============ 記帳卡片 ============ */
  .ledger-card {
    background: var(--paper);
    border: 2px solid var(--coffee);
    border-radius: 4px;
    padding: 18px;
    margin-bottom: 18px;
    cursor: pointer;
    position: relative;
    transition: all 0.3s ease;
    box-shadow: 3px 3px 0 var(--coffee-light);
    text-decoration: none;
    color: inherit;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .ledger-card:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 var(--coffee-light);
  }
  .ledger-card::before {
    content: '';
    position: absolute;
    top: -10px; left: 20px;
    width: 60px; height: 20px;
    background: rgba(76,175,80,0.28);
    border-radius: 1px;
    transform: rotate(-3deg);
  }
  .ledger-icon {
    font-size: 34px;
    flex-shrink: 0;
    line-height: 1;
  }
  .ledger-body { flex: 1; }
  .ledger-body h3 {
    font-family: var(--hand-display);
    font-size: 24px; color: var(--coffee);
    line-height: 1.1; margin-bottom: 4px;
  }
  .ledger-body .ldesc {
    font-size: 12px; color: var(--coffee-light);
    font-family: var(--body); line-height: 1.5;
  }
  .ledger-arrow {
    font-size: 20px; color: var(--coffee-light);
    flex-shrink: 0;
  }

  /* ============ 行事曆 ============ */
  .calendar-header {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 16px;
  }
  .calendar-nav {
    background: none;
    border: 1.5px solid var(--coffee);
    width: 36px; height: 36px;
    border-radius: 50%;
    color: var(--coffee); font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .calendar-nav:active { background: var(--pea-light); }
  .month-title {
    font-family: var(--hand-display);
    font-size: 30px; color: var(--coffee);
    transform: rotate(-1deg);
    text-align: center;
    line-height: 1;
  }
  .month-title .year {
    font-family: var(--body); font-size: 13px;
    color: var(--coffee-light); display: block;
    text-align: center; letter-spacing: 2px;
    margin-top: 2px;
  }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px; margin-bottom: 10px;
  }
  .weekdays div {
    text-align: center;
    font-family: var(--hand-display);
    font-size: 15px; color: var(--rose-dark);
    padding: 6px 0;
  }
  .weekdays div:first-child, .weekdays div:last-child {
    color: var(--rose); font-weight: 700;
  }

  .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }

  /* 普通日期格 - 不可點 */
  .day-cell {
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--body); font-size: 14px;
    color: var(--coffee-light);
    border-radius: 4px;
    position: relative;
    background: transparent;
    border: 1px dashed transparent;
  }
  .day-cell.other-month { color: var(--coffee-light); opacity: 0.25; }
  .day-cell.today {
    border: 2px solid var(--rose);
    color: var(--rose);
    font-weight: 700;
  }

  /* 🎯 有活動的日期 = 變成按鈕 */
  .day-button {
    aspect-ratio: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: var(--body); font-size: 14px;
    color: var(--paper);
    background: var(--pea-dark);
    border: 2px solid var(--coffee);
    border-radius: 6px;
    position: relative;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 2px 2px 0 var(--coffee);
    transition: all 0.15s ease;
    font-weight: 700;
    overflow: hidden;
  }
  .day-button:hover {
    background: var(--pea);
    transform: translate(-1px, -1px);
    box-shadow: 3px 3px 0 var(--coffee);
  }
  .day-button:active {
    background: var(--pea);
    transform: translate(2px, 2px);
    box-shadow: 0 0 0 var(--coffee);
  }

  /* 按鈕內裝飾：一個小三角告訴使用者「可點」 */
  .day-button::after {
    content: '↗';
    position: absolute;
    top: 2px; right: 4px;
    font-size: 9px;
    opacity: 0.7;
    font-weight: 400;
  }

  /* 旅行開始/結束 - 有特殊邊角 */
  .day-button.trip-start {
    border-left: 4px solid var(--rose);
    border-radius: 4px 12px 12px 4px;
  }
  .day-button.trip-end {
    border-right: 4px solid var(--rose);
    border-radius: 12px 4px 4px 12px;
  }
  .day-button.trip-start.trip-end {
    border-left: 4px solid var(--rose);
    border-right: 4px solid var(--rose);
    border-radius: 12px;
  }

  .day-button.today {
    box-shadow: 2px 2px 0 var(--coffee), 0 0 0 2px var(--rose) inset;
  }

  /* 旅行迷你標籤（行事曆下方） */
  .month-trips-list {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1.5px dashed var(--pea-light);
  }
  .month-trips-title {
    font-family: var(--hand-display);
    font-size: 20px;
    color: var(--coffee);
    margin-bottom: 12px;
  }
  .mini-trip-link {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: var(--cream);
    border: 1.5px solid var(--coffee);
    border-radius: 4px;
    margin-bottom: 10px;
    text-decoration: none;
    color: inherit;
    transition: all 0.2s;
    box-shadow: 2px 2px 0 var(--coffee-light);
  }
  .mini-trip-link:active {
    transform: translate(2px, 2px);
    box-shadow: 0 0 0 var(--coffee-light);
  }
  .mini-trip-link .date-block {
    flex-shrink: 0;
    background: var(--pea-dark);
    color: var(--paper);
    padding: 6px 10px;
    border-radius: 4px;
    font-family: var(--hand-display);
    font-size: 16px;
    line-height: 1;
    text-align: center;
    min-width: 56px;
  }
  .mini-trip-link .info {
    flex: 1;
    min-width: 0;
  }
  .mini-trip-link .info-title {
    font-family: var(--body);
    font-weight: 600;
    color: var(--coffee);
    font-size: 14px;
    margin-bottom: 2px;
  }
  .mini-trip-link .info-meta {
    font-size: 11px;
    color: var(--coffee-light);
  }
  .mini-trip-link .arrow {
    color: var(--rose);
    font-family: var(--hand-display);
    font-size: 22px;
    flex-shrink: 0;
  }

  .empty-month {
    text-align: center;
    padding: 24px 20px;
    color: var(--coffee-light);
    font-family: var(--hand-display);
    font-size: 18px;
  }
  .empty-month .hint {
    font-size: 12px;
    font-family: var(--body);
    margin-top: 4px;
    opacity: 0.7;
  }

  .footer-note {
    text-align: center;
    padding: 30px 20px 20px;
    font-family: var(--hand-loose);
    font-size: 13px; color: var(--coffee-light);
    letter-spacing: 1px;
  }
  .footer-note::before, .footer-note::after { content: '✦'; color: var(--rose); margin: 0 8px; }

  .error-box {
    background: rgba(201, 122, 110, 0.1);
    border: 1.5px solid var(--rose);
    border-radius: 4px;
    padding: 14px;
    margin: 16px 0;
    font-size: 13px;
    color: var(--rose-dark);
    line-height: 1.6;
  }
  .error-box strong { display: block; margin-bottom: 4px; font-family: var(--hand-display); font-size: 18px; }
  .error-box code {
    background: var(--paper);
    padding: 1px 5px;
    border-radius: 3px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px;
  }

  /* ============ 回憶相簿 photo strip ============ */
  .album-block { margin-bottom: 28px; }
  .album-trip-label {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 10px;
  }
  .album-trip-name {
    font-family: var(--hand-display);
    font-size: 18px;
    color: var(--coffee);
  }
  .album-trip-date {
    font-family: var(--body);
    font-size: 11px;
    color: var(--coffee-light);
    letter-spacing: 0.5px;
  }
  .strip-outer {
    margin: 0 -24px;
    padding: 8px 24px 14px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .strip-outer::-webkit-scrollbar { display: none; }
  .strip-inner {
    display: flex;
    gap: 14px;
    align-items: flex-end;
    width: max-content;
    padding-bottom: 4px;
  }
  .mini-polaroid {
    flex-shrink: 0;
    background: #fff;
    padding: 5px 5px 22px;
    box-shadow: 1px 3px 10px rgba(0,0,0,0.18), 0 0 0 0.5px rgba(0,0,0,0.06);
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    touch-action: manipulation;
  }
  .mini-polaroid:nth-child(3n+1) { transform: rotate(-2.5deg) translateY(2px); }
  .mini-polaroid:nth-child(3n+2) { transform: rotate(2deg); }
  .mini-polaroid:nth-child(3n)   { transform: rotate(-0.8deg) translateY(-2px); }
  .mini-polaroid:active { transform: scale(0.92) rotate(0deg) !important; box-shadow: 1px 1px 4px rgba(0,0,0,0.12) !important; }
  .mini-polaroid img {
    display: block;
    width: 88px;
    height: 88px;
    object-fit: cover;
    background: var(--cream-dark);
  }
  .mini-polaroid-caption {
    font-family: var(--hand-display);
    font-size: 11px;
    color: #888;
    text-align: center;
    padding-top: 5px;
    height: 14px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    max-width: 88px;
  }

  /* lightbox */
  .ix-lightbox {
    display: none;
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.9);
    align-items: center; justify-content: center;
  }
  .ix-lightbox.open { display: flex; }
  .ix-lightbox img { max-width: 92%; max-height: 88vh; border-radius: 4px; object-fit: contain; }
  .ix-lightbox-caption {
    position: absolute;
    bottom: 28px; left: 50%;
    transform: translateX(-50%);
    font-family: var(--hand-display);
    font-size: 18px;
    color: rgba(255,255,255,0.75);
    white-space: nowrap;
  }
  .ix-close {
    position: absolute; top: 16px; right: 20px;
    font-size: 28px; color: white;
    background: none; border: none; cursor: pointer;
    line-height: 1;
  }

  /* ============ 查詢 ============ */
  .filter-row { margin-bottom: 14px; }
  .filter-label {
    font-family: var(--hand-display);
    font-size: 13px;
    color: var(--coffee-light);
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .search-chips {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
  }
  .chip {
    background: none;
    border: 1.5px solid var(--coffee);

  /* Rating input */

    padding: 12px 20px 14px; flex-shrink: 0;
    border-bottom: 1px solid #EDE4CC;

  }

function tripMapFallback() {

window.initTripMap = async function () {
  try {
    const done = TRIPS.filter(t => t.status === 'done' && TRIP_GEO[t.id]);
    if (!done.length) { tripMapFallback(); return; }
    const { Map } = await google.maps.importLibrary('maps');
    const { AdvancedMarkerElement } = await google.maps.importLibrary('marker');
    tripMap = new Map(document.getElementById('tripMap'), {
      center: { lat: 23.9, lng: 120.9 }, zoom: 7.4,
      mapId: 'DEMO_MAP_ID', mapTypeId: 'hybrid',
      streetViewControl: false, mapTypeControl: false, fullscreenControl: true,
      gestureHandling: 'greedy',
    });
    const bounds = new google.maps.LatLngBounds();
    const chipWrap = document.getElementById('tripMapChips');
    chipWrap.innerHTML = '';
    chipWrap.appendChild(makeTripChip('🌍 全島', 'all', null));
    done.forEach(t => {
      const g = TRIP_GEO[t.id];
      const pin = document.createElement('div');
      pin.className = 'trip-pin'; pin.style.setProperty('--c', g.color);
      const sub = (t.tags && t.tags[0]) || '';
      pin.innerHTML = '<span class="dot"></span><b>' + t.destination + '</b>' + (sub ? '<span class="sub">・' + sub + '</span>' : '');
      const m = new AdvancedMarkerElement({ map: tripMap, position: { lat: g.lat, lng: g.lng }, content: pin, title: t.title });
      pin.addEventListener('click', () => { location.href = t.file; });
      bounds.extend({ lat: g.lat, lng: g.lng });
      tripMarkers.push({ t, g });
      chipWrap.appendChild(makeTripChip(t.destination, t.id, g.color));
    });
    if (tripMarkers.length > 1) tripMap.fitBounds(bounds, 70);
    else { tripMap.setCenter(bounds.getCenter()); tripMap.setZoom(12); }
  } catch (e) { console.warn('trip map failed', e); tripMapFallback(); }
};

function makeTripChip(label, id, color) {
  const b = document.createElement('button');
  b.className = 'trip-chip' + (id === 'all' ? ' active' : '');
  b.textContent = label;
  if (color) b.style.setProperty('--c', color);
  b.addEventListener('click', () => {
    document.querySelectorAll('#tripMapChips .trip-chip').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    if (id === 'all') {
      const bd = new google.maps.LatLngBounds();
      tripMarkers.forEach(o => bd.extend({ lat: o.g.lat, lng: o.g.lng }));
      tripMap.fitBounds(bd, 70);
    } else {
      const o = tripMarkers.find(x => x.t.id === id);
      if (o) { tripMap.panTo({ lat: o.g.lat, lng: o.g.lng }); tripMap.setZoom(13); }
    }
  });
  return b;
}

function loadTripMap() {

  const s = document.createElement('script'); s.async = true;
  s.src = 'https://maps.googleapis.com/maps/api/js?key=' + TRIP_GKEY + '&libraries=maps,marker&callback=initTripMap&loading=async';
  s.onerror = tripMapFallback;
  document.head.appendChild(s);
}
function setupTripMap() {
  const el = document.getElementById('tripMap'); if (!el) return;
  const io = new IntersectionObserver((ents) => {
    if (ents.some(e => e.isIntersecting)) { io.disconnect(); loadTripMap(); }
  }, { rootMargin: '250px' });
  io.observe(el);
}

function renderHome() {

function renderPastRow(trip) {

  `;

function formatDateRange(start, end) {
  const s = new Date(start);
  const e = new Date(end);
  if (s.getFullYear() === e.getFullYear() && s.getMonth() === e.getMonth()) {
    return `${s.getFullYear()}年${s.getMonth()+1}月${s.getDate()}-${e.getDate()}日`;
  }
  return `${s.getFullYear()}.${s.getMonth()+1}.${s.getDate()} - ${e.getFullYear()}.${e.getMonth()+1}.${e.getDate()}`;
}

// ============ 行事曆 ============
function renderCalendar() {
  document.getElementById('month-name').textContent = MONTH_NAMES[currentMonth];
  document.getElementById('year-name').textContent = currentYear;

  const firstDay = new Date(currentYear, currentMonth, 1);
  const lastDay = new Date(currentYear, currentMonth + 1, 0);
  const startOffset = firstDay.getDay();
  let html = '';

  // 上個月尾巴
  const prevMonthLast = new Date(currentYear, currentMonth, 0).getDate();
  for (let i = startOffset - 1; i >= 0; i--) {
    html += `<div class="day-cell other-month">${prevMonthLast - i}</div>`;
  }

  // 本月日期
  for (let d = 1; d <= lastDay.getDate(); d++) {
    const cellDate = new Date(currentYear, currentMonth, d);
    const dateStr = ymd(cellDate);
    const trip = findTripOnDate(dateStr);
    const isToday = ymd(today) === dateStr;

    if (trip) {
      // 🎯 有活動 → 變成按鈕
      const isStart = trip.startDate === dateStr;
      const isEnd = trip.endDate === dateStr;
      const classes = ['day-button'];
      if (isStart) classes.push('trip-start');
      if (isEnd) classes.push('trip-end');
      if (isToday) classes.push('today');

      html += `<a class="${classes.join(' ')}" href="${trip.file}" title="${trip.title}">${d}</a>`;
    } else {
      // 普通日期 → 不可點
      const classes = ['day-cell'];
      if (isToday) classes.push('today');
      html += `<div class="${classes.join(' ')}">${d}</div>`;
    }
  }

  // 下個月開頭
  const totalCells = startOffset + lastDay.getDate();
  const remainingCells = (7 - totalCells % 7) % 7;
  for (let i = 1; i <= remainingCells; i++) {
    html += `<div class="day-cell other-month">${i}</div>`;
  }

  document.getElementById('days-grid').innerHTML = html;

  // 顯示本月旅行清單
  renderMonthTrips();
}

function renderMonthTrips() {
  const monthTrips = TRIPS.filter(t => {
    const start = new Date(t.startDate);
    const end = new Date(t.endDate);
    // 旅行任何一天落在本月就算
    const monthStart = new Date(currentYear, currentMonth, 1);
    const monthEnd = new Date(currentYear, currentMonth + 1, 0);
    return start <= monthEnd && end >= monthStart;
  });

  const listEl = document.getElementById('month-trips-list');

  if (monthTrips.length === 0) {
    document.getElementById('month-trips-title').textContent = '本月旅行';
    listEl.innerHTML = `
      <div class="empty-month">
        ✿ 本月沒有旅行
        <div class="hint">空白的日子，醞釀著下一場冒險</div>
      </div>
    `;
    return;
  }

  document.getElementById('month-trips-title').textContent = `本月旅行 (${monthTrips.length})`;
  listEl.innerHTML = monthTrips.map(trip => {
    const s = new Date(trip.startDate);
    const e = new Date(trip.endDate);
    const sameDay = trip.startDate === trip.endDate;
    const dateText = sameDay
      ? `${s.getMonth()+1}/${s.getDate()}`
      : `${s.getMonth()+1}/${s.getDate()}-${e.getDate()}`;

    return `
      <a class="mini-trip-link" href="${trip.file}">
        <div class="date-block">${dateText}</div>
        <div class="info">
          <div class="info-title">${trip.title}</div>
          <div class="info-meta">${trip.destination} · ${trip.people}人</div>
        </div>
        <div class="arrow">→</div>
      </a>
    `;
  }).join('');
}

function ymd(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function findTripOnDate(dateStr) {
  return TRIPS.find(t => dateStr >= t.startDate && dateStr <= t.endDate);
}

document.getElementById('prev-month').onclick = () => {
  currentMonth--;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  renderCalendar();
};

document.getElementById('next-month').onclick = () => {
  currentMonth++;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }

};

function accumulateRatings(data) {
  if (!Array.isArray(data)) return;
  const acc = {};
  data.forEach(r => {
    if (!r.rating) return;
    if (!acc[r.trip_id]) acc[r.trip_id] = { sum: 0, count: 0 };
    acc[r.trip_id].sum   += r.rating;
    acc[r.trip_id].count += 1;
  });
  Object.entries(acc).forEach(([key, { sum, count }]) => {
    ratingsMap[key] = { avg: (sum / count).toFixed(1), count };
  });
}

async function loadAllRatings() {
  const fetches = TRIPS.filter(t => t.itemPrefix).map(trip =>
    fetch(`${SB_URL}/rest/v1/trip_reviews?trip_id=like.${trip.itemPrefix}*&order=created_at.desc`,
      { headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` } })
      .then(r => r.json()).then(accumulateRatings).catch(()=>{})
  );
  // 沒有 itemPrefix 的旅程（例如單店家行程）：spot 名稱本身就是 key，沒有共同前綴可以用 like 查，改成精準比對
  const noPrefixNames = TRIPS.filter(t => !t.itemPrefix).flatMap(t => (t.spots || []).map(s => s.name));
  if (noPrefixNames.length) {
    const inList = noPrefixNames.map(n => encodeURIComponent(n)).join(',');
    fetches.push(
      fetch(`${SB_URL}/rest/v1/trip_reviews?trip_id=in.(${inList})&order=created_at.desc`,
        { headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` } })
        .then(r => r.json()).then(accumulateRatings).catch(()=>{})
    );
  }
  // Also load ratings for daily food spots
  fetches.push(
    fetch(`${SB_URL}/rest/v1/trip_reviews?trip_id=like.food__*&order=created_at.desc`,
      { headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` } })
      .then(r => r.json()).then(accumulateRatings).catch(()=>{})
  );
  await Promise.all(fetches);
  renderSearch();
}

async function loadUserFoodSpots() {
  try {
    const res = await fetch(
      `${SB_URL}/rest/v1/ledger_entries?type=eq.expense&note=like.*%23spot&select=note,date,amount,category&order=date.desc`,
      { headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` } }
    );
    const entries = await res.json();
    if (!Array.isArray(entries)) return;

    const existingNames = new Set(TRIPS.flatMap(t => (t.spots || []).map(s => s.name)));
    const seen = new Set();
    userFoodSpots = [];

    for (const e of entries) {
      const raw      = e.note?.trim();
      if (!raw) continue;
      const spotBody = raw.endsWith('#spot') ? raw.slice(0, -5) : raw;
      const pipeIdx  = raw.endsWith('#spot') ? spotBody.lastIndexOf('|') : -1;
      const name     = pipeIdx >= 0 ? spotBody.slice(0, pipeIdx) : spotBody;
      const noteRegion = pipeIdx >= 0 ? spotBody.slice(pipeIdx + 1).trim() : null;
      if (!name || seen.has(name) || existingNames.has(name)) continue;
      seen.add(name);
      const trip   = TRIPS.find(t => t.startDate && t.endDate && e.date >= t.startDate && e.date <= t.endDate);
      const region = noteRegion || (trip ? trip.destination : '未分類');
      const CAT_MAP = { '食': ['食物','🍽️'], '住': ['住宿','🏨'], '行': ['室外景點','🚗'],
                        '育': ['室內景點','🎓'], '樂': ['室外景點','🎡'] };
      const [category, emoji] = CAT_MAP[e.category] || ['室外景點','📍'];
      userFoodSpots.push({
        name, category, region, emoji,
        desc: '日常記錄',
        prefix: 'food__', tripFile: 'account.html', mapUrl: null,
        date: e.date, sortDate: e.date,
      });
    }
    renderRegionSelector();
    renderSearch();
  } catch(e) { console.warn('食物景點載入失敗', e); }
}

function getAllUsedRegions() {
  return new Set([
    ...TRIPS.flatMap(t => (t.spots || []).map(s => s.region)),
    ...userFoodSpots.map(s => s.region),
  ].filter(Boolean));
}

function buildRegionSelector() { renderRegionSelector(); }

function renderRegionSelector() {
  const container = document.getElementById('region-selector');
  if (!container) return;
  const allRegions = getAllUsedRegions();
  let html = '<div class="region-parent-row">';
  html += `<button class="region-parent-btn ${activeRegion === 'all' ? 'city-active' : ''}" onclick="setRegionAll()">🗾 全部</button>`;
  REGION_HIERARCHY.forEach(city => {
    if (!city.regions.some(r => allRegions.has(r))) return;
    const isOpen = openCityKey === city.key;
    const isCityActive = activeRegion === 'city:' + city.key || city.regions.includes(activeRegion);
    const cls = ['region-parent-btn', isCityActive ? 'city-active' : '', isOpen ? 'city-open' : ''].filter(Boolean).join(' ');
    html += `<button class="${cls}" onclick="toggleCity('${city.key}')">${city.emoji} ${city.label} <span class="region-expand-arrow">›</span></button>`;
  });
  html += '</div>';
  REGION_HIERARCHY.forEach(city => {
    const subs = city.regions.filter(r => allRegions.has(r));
    if (!subs.length) return;
    const isOpen = openCityKey === city.key;
    html += `<div class="region-sub-panel ${isOpen ? 'open' : ''}">`;
    subs.forEach(r => {
      const safe = r.replace(/'/g, '&#39;');
      html += `<button class="region-sub-btn ${activeRegion === r ? 'active' : ''}" onclick="setRegionSub('${safe}','${city.key}')">${r}</button>`;
    });
    html += '</div>';
  });
  container.innerHTML = html;
}

function setRegionAll() {
  activeRegion = 'all'; openCityKey = null;
  renderRegionSelector(); renderSearch();
}
function toggleCity(cityKey) {
  if (openCityKey === cityKey) { openCityKey = null; activeRegion = 'all'; }
  else { openCityKey = cityKey; activeRegion = 'city:' + cityKey; }
  renderRegionSelector(); renderSearch();
}
function setRegionSub(region, cityKey) {
  activeRegion = (activeRegion === region) ? 'city:' + cityKey : region;
  openCityKey = cityKey;
  renderRegionSelector(); renderSearch();
}

function renderSearch() {
  const TODAY = new Date().toISOString().slice(0, 10);
  const allSpots = [];
  TRIPS.forEach(trip => {
    if (trip.startDate && trip.startDate > TODAY) return;
    (trip.spots || []).forEach(spot => {
      allSpots.push({ ...spot, tripFile: trip.file, prefix: trip.itemPrefix || '', sortDate: trip.startDate || '' });
    });
  });
  allSpots.push(...userFoodSpots);

  let filtered = allSpots;
  if (activeCategory !== 'all') filtered = filtered.filter(s => s.category === activeCategory);
  if (activeRegion !== 'all') {
    if (activeRegion.startsWith('city:')) {
      const cityKey = activeRegion.slice(5);
      const city = REGION_HIERARCHY.find(c => c.key === cityKey);
      if (city) filtered = filtered.filter(s => city.regions.includes(s.region));
    } else {
      filtered = filtered.filter(s => s.region === activeRegion);
    }
  }
  if (searchText) {
    const q = searchText.toLowerCase();
    filtered = filtered.filter(s =>
      s.name.toLowerCase().includes(q) ||
      (s.desc && s.desc.toLowerCase().includes(q)) ||
      (s.region && s.region.toLowerCase().includes(q))
    );
  }

  if (sortMode === 'newest') {
    filtered = [...filtered].sort((a, b) => (b.sortDate || '').localeCompare(a.sortDate || ''));
  } else {
    filtered = [...filtered].sort((a, b) => {
      const ra = ratingsMap[a.prefix + a.name];
      const rb = ratingsMap[b.prefix + b.name];
      if (ra && rb)  return parseFloat(rb.avg) - parseFloat(ra.avg);
      if (ra && !rb) return -1;
      if (!ra && rb) return 1;
      return 0;
    });
  }

  const countEl = document.getElementById('search-count');
  const parts = [];
  if (searchText) parts.push(`"${searchText}"`);
  if (activeCategory !== 'all') parts.push(activeCategory);
  if (activeRegion !== 'all') {
    if (activeRegion.startsWith('city:')) {
      const city = REGION_HIERARCHY.find(c => c.key === activeRegion.slice(5));
      if (city) parts.push(city.label);
    } else {
      parts.push(activeRegion);
    }
  }
  countEl.textContent = parts.length
    ? `${parts.join(' · ')} · ${filtered.length} 個地點`
    : `共 ${filtered.length} 個地點`;

  const container = document.getElementById('search-results');
  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><h4>沒有符合的地點</h4><p>試試其他條件</p></div>`;
    return;
  }

  currentSpots = filtered;
  container.innerHTML = filtered.map((spot, i) => {
    const ratingData = ratingsMap[spot.prefix + spot.name];
    const ratingHTML = ratingData
      ? `<span class="spot-rating">⭐ ${ratingData.avg} <span class="rating-count">(${ratingData.count}則)</span></span>`
      : `<span class="spot-rating unrated">尚未評分</span>`;
    return `
    <div class="spot-result-card" onclick="openSpotModal(${i})">
      <div class="spot-result-emoji">${spot.emoji}</div>
      <div class="spot-result-body">
        <div class="spot-result-name">${escHtml(spot.name)}</div>
        <div class="spot-result-desc">${escHtml(spot.desc)}</div>
        <div class="spot-result-meta">
          ${ratingHTML}
          <span class="spot-result-trip">📍 ${escHtml(spot.region)}</span>
        </div>
      </div>
      <span class="spot-cat-badge ${spot.category}">${spot.category}</span>
    </div>`;
  }).join('');
}

function paintStars(n) {

  });
}
document.getElementById('smd-stars-row').addEventListener('click', e => {
  const btn = e.target.closest('.smd-star');
  if (!btn) return;
  modalStarPick = +btn.dataset.s;
  paintStars(modalStarPick);

    const submitBtn = document.getElementById('smd-submit-btn');
    submitBtn.textContent = '送出評分';
    submitBtn.disabled = false;

document.getElementById('smd-submit-btn').addEventListener('click', async () => {
  if (!modalStarPick) { alert('請先點選星星評分'); return; }
  const submitBtn = document.getElementById('smd-submit-btn');
  const comment   = document.getElementById('smd-comment-inp').value.trim() || null;
  smdSubmitting = true;
  submitBtn.textContent = '送出中…';
  submitBtn.disabled = true;
  try {
    const res = await fetch(`${SB_URL}/rest/v1/trip_reviews`, {
      method: 'POST',
      headers: {
        apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`,
        'Content-Type': 'application/json', Prefer: 'return=minimal',
      },
      body: JSON.stringify({ trip_id: modalSpotKey, rating: modalStarPick, comment }),
    });
    if (!res.ok && res.status !== 201) throw new Error(await res.text());

    submitBtn.textContent = '謝謝你的評分 ✓';
    modalStarPick = 0;
    paintStars(0);
    document.getElementById('smd-comment-inp').value = '';
    // 短暫顯示感謝後恢復可再評分的狀態
    setTimeout(() => {
      if (!smdSubmitting) {
        submitBtn.textContent = '送出評分';
        submitBtn.disabled = false;
      }
    }, 1500);

    // Refresh this spot's review list + update ratingsMap
    await loadModalReviews(modalSpotKey);

  } catch(e) {
    alert('評分失敗：' + e.message);
    submitBtn.textContent = '送出評分';
    submitBtn.disabled = false;
  } finally {
    smdSubmitting = false;
  }

// ============ 想去清單 ============
// 資料存在 Supabase trip_reviews：trip_id = 'wish__{itemId}'、comment = JSON 事件。
// 採 insert-only 事件流（add / done / del），讀取時依 created_at 順序折疊出最新狀態，
// 不需要 UPDATE/DELETE 權限，也不用開新資料表。wish__ 開頭的資料不會進任何評分統計。
const WISH_PREFIX = 'wish__';
const WISH_CITY_SEEDS = ['台北', '新北', '台中', '台南', '高雄', '東京', '大阪', '京都', '首爾', '曼谷'];
let wishItems = {};
let wishFilter = 'todo';
let wishCityFilter = 'all';
let wishLoaded = false;

async function loadWishlist() {
  try {
    const res = await fetch(
      `${SB_URL}/rest/v1/trip_reviews?trip_id=like.${WISH_PREFIX}*&order=created_at.asc`,
      { headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` } }
    );
    const rows = await res.json();
    if (!Array.isArray(rows)) return;
    wishItems = {};
    rows.forEach(r => {
      const id = r.trip_id.slice(WISH_PREFIX.length);
      let ev;
      try { ev = JSON.parse(r.comment); } catch { return; }
      if (!ev || typeof ev !== 'object') return;
      if (ev.t === 'add') {
        wishItems[id] = {
          name: String(ev.name || '').slice(0, 40),
          city: String(ev.city || '').slice(0, 20),
          cat: ev.cat === '景點' ? '景點' : '食物',
          ig: typeof ev.ig === 'string' && /^https?:\/\//.test(ev.ig) ? ev.ig : '',
          note: String(ev.note || '').slice(0, 60),
          done: false,
          ts: r.created_at || '',
        };
      } else if (ev.t === 'done' && wishItems[id]) {
        wishItems[id].done = !!ev.v;
      } else if (ev.t === 'del') {
        delete wishItems[id];
      }
    });
    wishLoaded = true;
    renderWishlist();
  } catch (e) { console.warn('想去清單載入失敗', e); }
}

async function wishInsert(itemId, payload) {
  const post = body => fetch(`${SB_URL}/rest/v1/trip_reviews`, {
    method: 'POST',
    headers: {
      apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`,
      'Content-Type': 'application/json', Prefer: 'return=minimal',
    },
    body: JSON.stringify(body),
  });
  const row = { trip_id: WISH_PREFIX + itemId, comment: JSON.stringify(payload), rating: null };
  let res = await post(row);
  if (!res.ok && res.status !== 201) {
    // 若 rating 欄位不接受 null，改填 1（wish__ 資料不會出現在任何評分統計裡）
    res = await post({ ...row, rating: 1 });
  }
  return res.ok || res.status === 201;
}

function getWishCityValue() {
  const sel = document.getElementById('wish-city-select');
  if (sel.value === '__custom__') return document.getElementById('wish-city-custom').value.trim();
  return sel.value;
}

function refreshWishCitySelect() {
  const sel = document.getElementById('wish-city-select');
  const prev = sel.value;
  const used = [...new Set(Object.values(wishItems).map(it => it.city).filter(Boolean))];
  const all = [...new Set([...used, ...WISH_CITY_SEEDS])];
  sel.innerHTML =
    '<option value="">城市（選填）</option>' +
    all.map(c => `<option value="${escHtml(c)}">${escHtml(c)}</option>`).join('') +
    '<option value="__custom__">＋ 自訂城市…</option>';
  if (prev && (prev === '__custom__' || all.includes(prev))) sel.value = prev;
}

async function addWishItem() {
  const nameEl = document.getElementById('wish-name');
  const igEl   = document.getElementById('wish-ig');
  const noteEl = document.getElementById('wish-note');
  const btn    = document.getElementById('wish-add-btn');
  const name = nameEl.value.trim();
  if (!name) { nameEl.focus(); return; }
  const ig = igEl.value.trim();
  if (ig && !/^https?:\/\//.test(ig)) { alert('IG 連結請貼完整網址（https:// 開頭）'); return; }
  const cat = document.querySelector('#wish-cat-row .chip.active').dataset.cat;
  const item = { t: 'add', name, city: getWishCityValue(), cat, ig, note: noteEl.value.trim() };
  btn.disabled = true; btn.textContent = '儲存中…';
  const id = 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const ok = await wishInsert(id, item);
  btn.disabled = false; btn.textContent = '＋ 加入想去清單';
  if (!ok) { alert('儲存失敗，請再試一次'); return; }
  wishItems[id] = { name: item.name, city: item.city, cat, ig, note: item.note, done: false, ts: new Date().toISOString() };
  nameEl.value = ''; igEl.value = ''; noteEl.value = '';
  document.getElementById('wish-city-select').value = '';
  document.getElementById('wish-city-custom').value = '';
  document.getElementById('wish-city-custom').style.display = 'none';
  renderWishlist();
}

async function toggleWishDone(id) {
  const item = wishItems[id];
  if (!item) return;
  item.done = !item.done;
  renderWishlist();
  const ok = await wishInsert(id, { t: 'done', v: item.done });
  if (!ok) { item.done = !item.done; renderWishlist(); alert('狀態儲存失敗，請再試一次'); }
}

async function deleteWishItem(id) {
  const item = wishItems[id];
  if (!item) return;
  if (!confirm(`確定刪除「${item.name}」？`)) return;
  const backup = item;
  delete wishItems[id];
  renderWishlist();
  const ok = await wishInsert(id, { t: 'del' });
  if (!ok) { wishItems[id] = backup; renderWishlist(); alert('刪除失敗，請再試一次'); }
}

function renderWishlist() {
  const entries = Object.entries(wishItems);
  const cities = [...new Set(entries.map(([, it]) => it.city).filter(Boolean))];

  // 城市快速篩選 chips（有 2 個以上城市才顯示）
  const cityChipsEl = document.getElementById('wish-city-chips');
  if (cities.length > 1) {
    if (wishCityFilter !== 'all' && !cities.includes(wishCityFilter)) wishCityFilter = 'all';
    cityChipsEl.innerHTML =
      `<button class="chip ${wishCityFilter === 'all' ? 'active' : ''}" data-c="all">全部城市</button>` +
      cities.map(c => `<button class="chip ${wishCityFilter === c ? 'active' : ''}" data-c="${escHtml(c)}">${escHtml(c)}</button>`).join('');
    cityChipsEl.querySelectorAll('.chip').forEach(b => {
      b.addEventListener('click', () => { wishCityFilter = b.dataset.c; renderWishlist(); });
    });
  } else {
    wishCityFilter = 'all';
    cityChipsEl.innerHTML = '';
  }

  // 城市下拉選單（已用過的城市排前面）
  refreshWishCitySelect();

  let list = entries;
  if (wishFilter === 'todo') list = list.filter(([, it]) => !it.done);
  if (wishFilter === 'done') list = list.filter(([, it]) => it.done);
  if (wishCityFilter !== 'all') list = list.filter(([, it]) => it.city === wishCityFilter);
  // 還沒去的排前面，各自新→舊
  list.sort(([, a], [, b]) => (a.done - b.done) || (b.ts || '').localeCompare(a.ts || ''));

  const todoCount = entries.filter(([, it]) => !it.done).length;
  const doneCount = entries.length - todoCount;
  document.getElementById('wish-count').textContent =
    entries.length ? `還沒去 ${todoCount} 個・去過了 ${doneCount} 個` : '';

  const listEl = document.getElementById('wish-list');
  if (!list.length) {
    listEl.innerHTML = `<div class="wish-empty">${
      entries.length ? '這個條件下沒有東西 ☁️'
      : wishLoaded ? '清單空空的，把 IG 上看到的加進來吧 ✨' : '載入中…'
    }</div>`;
    return;
  }
  listEl.innerHTML = list.map(([id, it]) => `
    <div class="wish-card ${it.done ? 'done' : ''}" data-id="${escHtml(id)}">
      <button class="wish-check" type="button" title="${it.done ? '取消打勾' : '去過了打勾'}">${it.done ? '✓' : ''}</button>
      <div class="wish-body">
        <div class="wish-name">${it.cat === '食物' ? '🍽' : '📍'} ${escHtml(it.name)}</div>
        <div class="wish-meta">
          ${it.city ? `<span class="wish-badge">📍 ${escHtml(it.city)}</span>` : ''}
          <span class="wish-badge ${it.cat === '食物' ? 'cat-food' : ''}">${escHtml(it.cat)}</span>
          ${it.ig ? `<a class="wish-ig-link" href="${escHtml(it.ig)}" target="_blank" rel="noopener">📸 IG</a>` : ''}
        </div>
        ${it.note ? `<div class="wish-note">${escHtml(it.note)}</div>` : ''}
      </div>
      <button class="wish-del" type="button" title="刪除">✕</button>
    </div>`).join('');
  listEl.querySelectorAll('.wish-card').forEach(card => {
    const id = card.dataset.id;
    card.querySelector('.wish-check').addEventListener('click', () => toggleWishDone(id));
    card.querySelector('.wish-del').addEventListener('click', () => deleteWishItem(id));
  });
}

document.getElementById('wish-add-btn').addEventListener('click', addWishItem);
document.getElementById('wish-city-select').addEventListener('change', function() {
  const custom = document.getElementById('wish-city-custom');
  const isCustom = this.value === '__custom__';
  custom.style.display = isCustom ? '' : 'none';
  if (isCustom) custom.focus();
});
document.getElementById('wish-cat-row').querySelectorAll('.chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.getElementById('wish-cat-row').querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});
document.getElementById('wish-filter-chips').querySelectorAll('.chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.getElementById('wish-filter-chips').querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    wishFilter = btn.dataset.f;
    renderWishlist();
  });
});
// 切到想去分頁時重新整理一次（同步另一支手機的變更）
document.querySelector('.tab-btn[data-tab="wishlist"]').addEventListener('click', loadWishlist);
refreshWishCitySelect();
loadWishlist();

// Pull down from the top of the page to reload the current data.
const pullRefreshIndicator = document.getElementById('pull-refresh-indicator');
const pullRefreshThreshold = 88;
let pullStartY = 0;
let pullDistance = 0;
let isPullingToRefresh = false;

function resetPullRefresh() {
  pullDistance = 0;
  pullRefreshIndicator.style.removeProperty('transform');
  pullRefreshIndicator.classList.remove('visible', 'ready');
}

window.addEventListener('touchstart', event => {
  if (window.scrollY > 0 || event.touches.length !== 1) return;
  pullStartY = event.touches[0].clientY;
  pullDistance = 0;
  isPullingToRefresh = true;
}, { passive: true });

window.addEventListener('touchmove', event => {
  if (!isPullingToRefresh) return;

  const distance = event.touches[0].clientY - pullStartY;
  if (distance <= 0) {
    resetPullRefresh();
    return;
  }

  pullDistance = Math.min(distance * 0.45, pullRefreshThreshold + 24);
  pullRefreshIndicator.style.transform = `translate(-50%, ${pullDistance - 54}px)`;
  pullRefreshIndicator.classList.add('visible');
  pullRefreshIndicator.classList.toggle('ready', pullDistance >= pullRefreshThreshold);
  event.preventDefault();
}, { passive: false });

window.addEventListener('touchend', () => {
  if (!isPullingToRefresh) return;
  isPullingToRefresh = false;

  if (pullDistance >= pullRefreshThreshold) {
    pullRefreshIndicator.classList.remove('ready');
    pullRefreshIndicator.classList.add('loading');
    window.location.reload();
    return;
  }

  resetPullRefresh();
});

window.addEventListener('touchcancel', () => {
  isPullingToRefresh = false;
  resetPullRefresh();
});

// 啟動
bootstrap();
</script>
</body>
</html>
