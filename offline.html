<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF7EC">
  <title>目前離線｜happy lucky</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh; display: grid; place-items: center; text-align: center;
      padding: calc(28px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));
      background: #FBF7EC; color: #3D2E1F;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
    }
    main { width: min(340px, 100%); }
    .icon { font-size: 58px; }
    h1 { margin: 16px 0 8px; font-size: 24px; }
    p { color: #6B5640; line-height: 1.7; }
    button {
      width: 100%; min-height: 48px; margin-top: 18px; border: 0; border-radius: 14px;
      background: #C4527A; color: #fff; font: inherit; font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon">☁️</div>
    <h1>現在沒有網路</h1>
    <p>已經看過的旅行內容仍可離線瀏覽；首次開啟的頁面需要連線後才能載入。</p>
    <button type="button" onclick="location.reload()">重新連線</button>
  </main>
</body>
</html>
