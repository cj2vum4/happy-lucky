<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>每日記帳</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
:root {
  --red: #FF5252;
  --red-d: #D32F2F;
  --red-bg: #FFEBEE;
  --green: #43A047;
  --green-bg: #E8F5E9;
  --bg: #F0F2F5;
  --card: #FFFFFF;
  --text: #1A1A1A;
  --text2: #666;
  --text3: #BDBDBD;
  --border: #E8E8E8;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; font-size: 15px; }
body {
  font-family: -apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif;
  background: var(--bg);
  color: var(--text);
}

.app {
  max-width: 430px;
  margin: 0 auto;
  height: 100svh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}

/* Header */
.hdr {
  background: var(--red);
  padding: 44px 20px 0;
  flex-shrink: 0;
}
.hdr-row {
  display: flex;
  align-items: center;
  justify-content: center;
  padding-bottom: 0;
  position: relative;
}
.back-btn {
  position: absolute; left: 0;
  background: none; border: none;
  color: white; font-size: 24px;
  cursor: pointer; padding: 0 6px;
  line-height: 1;
}
.hdr-title {
  font-size: 17px;
  font-weight: 700;
  color: white;
  letter-spacing: 1px;
}

/* Top tab bar */
.tab-bar {
  display: flex;
  background: var(--red);
  margin-top: 8px;
  flex-shrink: 0;
}
.tab-item {
  flex: 1;
  padding: 10px 0 12px;
  font-size: 13px;
  color: rgba(255,255,255,0.65);
  cursor: pointer;
  border: none;
  background: none;
  font-family: inherit;
  font-weight: 500;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.tab-item.active {
  color: white;
  font-weight: 700;
  border-bottom-color: white;
}

/* Scrollable content */
.pages {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}
.page { display: none; padding-bottom: 100px; }
.page.active { display: block; }

/* Date nav */
.date-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 12px 20px;
  background: white;
  border-bottom: 1px solid var(--border);
}
.date-nav button {
  background: none; border: none;
  color: var(--text2); font-size: 20px;
  cursor: pointer; padding: 4px 10px;
  border-radius: 6px;
  transition: background 0.15s;
}
.date-nav button:active { background: var(--bg); }
.date-nav .dlabel {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  min-width: 130px;
  text-align: center;
}

/* Summary card */
.summary-card {
  margin: 12px 16px;
  background: white;
  border-radius: 14px;
  padding: 16px 8px;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  text-align: center;
  box-shadow: 0 1px 6px rgba(0,0,0,0.07);
}
.si + .si { border-left: 1px solid var(--border); }
.si .slabel { font-size: 11px; color: var(--text2); margin-bottom: 5px; }
.si .samt { font-size: 17px; font-weight: 700; }
.samt.exp { color: var(--red); }
.samt.inc { color: var(--green); }
.samt.bal { color: var(--text); }

/* Entry list */
.entries-wrap { padding: 0 16px; }
.entries-empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text3);
  font-size: 14px;
}
.entries-empty .eicon { font-size: 44px; margin-bottom: 10px; }

.entry-item {
  background: white;
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
}
.ent-icon {
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.ent-icon.exp { background: var(--red-bg); }
.ent-icon.inc { background: var(--green-bg); }
.ent-body { flex: 1; min-width: 0; }
.ent-cat { font-size: 14px; font-weight: 600; }
.ent-note {
  font-size: 12px; color: var(--text2);
  margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ent-amt { font-size: 16px; font-weight: 700; flex-shrink: 0; }
.ent-amt.exp { color: var(--red); }
.ent-amt.inc { color: var(--green); }
.ent-del {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: none; border: none;
  color: var(--text3); font-size: 14px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s;
}
.ent-del:active { background: var(--bg); color: var(--red); }

/* Monthly summary */
.month-card {
  margin: 12px 16px;
  background: white;
  border-radius: 14px;
  padding: 16px 18px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.07);
}
.mrow {
  display: flex; justify-content: space-between;
  padding: 5px 0; font-size: 14px;
}
.mrow.mtotal {
  border-top: 1px solid var(--border);
  margin-top: 8px; padding-top: 12px;
  font-weight: 700; font-size: 15px;
}

/* Chart sections */
.chart-card {
  margin: 0 16px 12px;
  background: white;
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.07);
}
.chart-hdg {
  font-size: 12px;
  font-weight: 700;
  color: var(--text2);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  margin-bottom: 14px;
}

/* Category breakdown */
.cat-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
}
.cat-row:last-child { border-bottom: none; }
.cr-icon { font-size: 20px; width: 28px; text-align: center; flex-shrink: 0; }
.cr-name { flex: 1; font-size: 14px; }
.cr-bar-wrap {
  width: 70px; height: 4px;
  background: var(--border); border-radius: 2px; overflow: hidden;
}
.cr-bar { height: 100%; background: var(--red); border-radius: 2px; }
.cr-amt { font-size: 14px; font-weight: 600; color: var(--red); min-width: 72px; text-align: right; }

/* Ledger tab */
.ledger-group { padding: 12px 16px 0; }
.ldg-date-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 2px 8px;
}
.ldg-date { font-size: 13px; font-weight: 600; color: var(--text2); }
.ldg-total { font-size: 13px; color: var(--text2); }

/* Bottom nav */
.bottom-nav {
  flex-shrink: 0;
  display: flex;
  background: white;
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.bnav-btn {
  flex: 1;
  padding: 8px 0 5px;
  display: flex; flex-direction: column;
  align-items: center; gap: 2px;
  background: none; border: none;
  cursor: pointer; font-family: inherit;
  color: var(--text3); font-size: 10px;
  transition: color 0.2s;
}
.bnav-btn .ni { font-size: 22px; line-height: 1; }
.bnav-btn.active { color: var(--red); }

/* FAB */
.fab {
  position: absolute;
  bottom: 72px;
  right: 20px;
  width: 54px; height: 54px;
  border-radius: 50%;
  background: var(--red);
  color: white;
  border: none;
  font-size: 26px;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(255,82,82,0.45);
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.15s, box-shadow 0.15s;
  z-index: 100;
  line-height: 1;
}
.fab:active { transform: scale(0.92); box-shadow: 0 2px 8px rgba(255,82,82,0.3); }

/* Bottom sheet overlay */
.overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 300;
  align-items: flex-end;
  justify-content: center;
}
.overlay.open { display: flex; }
.sheet {
  width: 100%;
  max-width: 430px;
  background: white;
  border-radius: 20px 20px 0 0;
  padding-bottom: env(safe-area-inset-bottom, 12px);
  animation: slideUp 0.28s cubic-bezier(0.32,0.72,0,1);
  overflow: hidden;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.sheet-handle {
  text-align: center; padding: 10px 0 4px;
}
.sheet-handle::before {
  content: '';
  display: inline-block;
  width: 38px; height: 4px;
  background: var(--border); border-radius: 2px;
}

/* Type toggle */
.type-toggle {
  display: flex; margin: 6px 16px 2px;
  background: var(--bg); border-radius: 10px; padding: 3px;
}
.type-btn {
  flex: 1; padding: 9px;
  border: none; background: none;
  border-radius: 8px;
  font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
  font-family: inherit; color: var(--text2);
}
.type-btn.active.exp { background: var(--red); color: white; box-shadow: 0 2px 8px rgba(255,82,82,0.35); }
.type-btn.active.inc { background: var(--green); color: white; box-shadow: 0 2px 8px rgba(67,160,71,0.35); }

/* Amount display */
.amt-display {
  text-align: right;
  padding: 10px 20px 4px;
  font-size: 38px;
  font-weight: 700;
  letter-spacing: 1px;
  min-height: 58px;
  border-bottom: 1px solid var(--border);
}
.amt-display.exp { color: var(--red); }
.amt-display.inc { color: var(--green); }

/* Category grid */
.cat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px; padding: 10px 14px 4px;
}
.cat-btn {
  display: flex; flex-direction: column;
  align-items: center; gap: 3px;
  padding: 9px 4px 8px;
  background: var(--bg); border: 2px solid transparent;
  border-radius: 10px; cursor: pointer;
  transition: all 0.15s; font-family: inherit;
}
.cat-btn.sel.exp { border-color: var(--red); background: var(--red-bg); }
.cat-btn.sel.inc { border-color: var(--green); background: var(--green-bg); }
.cat-emoji { font-size: 22px; }
.cat-name { font-size: 10px; color: var(--text2); white-space: nowrap; }

/* Note input */
.note-inp {
  margin: 6px 16px;
  padding: 10px 12px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; font-size: 14px;
  font-family: inherit; color: var(--text);
  width: calc(100% - 32px); outline: none;
}
.note-inp:focus { border-color: var(--red); }

/* Numpad */
.numpad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--border);
  border-top: 1px solid var(--border);
}
.nk {
  background: white; border: none;
  padding: 17px; font-size: 20px;
  font-family: inherit; cursor: pointer;
  color: var(--text); transition: background 0.1s;
}
.nk:active { background: var(--bg); }
.nk.del { font-size: 16px; }
.nk.save {
  background: var(--red); color: white;
  font-size: 15px; font-weight: 700;
}
.nk.save.inc { background: var(--green); }
.nk.save:active { opacity: 0.85; background: var(--red); }
.nk.save.inc:active { background: var(--green); }

/* Loading */
.loading { text-align: center; padding: 48px; color: var(--text3); font-size: 14px; }
.err-box {
  margin: 16px; padding: 16px;
  background: var(--red-bg); border-radius: 10px;
  font-size: 13px; color: var(--red-d); line-height: 1.6;
}
</style>
</head>
<body>
<div class="app">

  <div class="hdr">
    <div class="hdr-row">
      <a href="index.html" class="back-btn">‹</a>
      <div class="hdr-title">每日記帳</div>
    </div>
    <div class="tab-bar">
      <button class="tab-item active" data-tab="today">今日</button>
      <button class="tab-item" data-tab="monthly">月報</button>
      <button class="tab-item" data-tab="ledger">帳本</button>
    </div>
  </div>

  <div class="pages">

    <!-- 今日 -->
    <div id="tab-today" class="page active">
      <div class="date-nav">
        <button id="prev-day">‹</button>
        <div class="dlabel" id="today-label">載入中…</div>
        <button id="next-day">›</button>
      </div>
      <div class="summary-card" id="today-summary"></div>
      <div class="entries-wrap" id="today-entries"></div>
    </div>

    <!-- 月報 -->
    <div id="tab-monthly" class="page">
      <div class="date-nav">
        <button id="prev-month">‹</button>
        <div class="dlabel" id="month-label">載入中…</div>
        <button id="next-month">›</button>
      </div>
      <div class="month-card" id="month-summary"></div>
      <div class="chart-card" style="margin-top:12px">
        <div class="chart-hdg">每日支出</div>
        <canvas id="bar-chart" height="130"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-hdg">支出分類佔比</div>
        <canvas id="pie-chart" height="200"></canvas>
      </div>
      <div class="chart-card" id="cat-breakdown"></div>
    </div>

    <!-- 帳本 -->
    <div id="tab-ledger" class="page">
      <div id="ledger-list"></div>
    </div>

  </div>

  <div class="bottom-nav">
    <button class="bnav-btn active" data-tab="today"><span class="ni">📅</span>今日</button>
    <button class="bnav-btn" data-tab="monthly"><span class="ni">📊</span>月報</button>
    <button class="bnav-btn" data-tab="ledger"><span class="ni">📒</span>帳本</button>
  </div>

  <button class="fab" id="fab-btn">＋</button>

</div><!-- .app -->

<!-- Add entry sheet -->
<div class="overlay" id="overlay">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="type-toggle">
      <button class="type-btn active exp" data-type="expense">支出</button>
      <button class="type-btn inc" data-type="income">收入</button>
    </div>
    <div class="amt-display exp" id="amt-display">0</div>
    <div class="cat-grid" id="cat-grid"></div>
    <input class="note-inp" id="note-inp" placeholder="備註（選填）" maxlength="50" autocomplete="off">
    <div class="numpad">
      <button class="nk" data-k="7">7</button>
      <button class="nk" data-k="8">8</button>
      <button class="nk" data-k="9">9</button>
      <button class="nk" data-k="4">4</button>
      <button class="nk" data-k="5">5</button>
      <button class="nk" data-k="6">6</button>
      <button class="nk" data-k="1">1</button>
      <button class="nk" data-k="2">2</button>
      <button class="nk" data-k="3">3</button>
      <button class="nk del" data-k="del">⌫</button>
      <button class="nk" data-k="0">0</button>
      <button class="nk save exp" id="save-btn">確認</button>
    </div>
  </div>
</div>

<script>
// ─── Config ───────────────────────────────────────────────────────────────────
const SB_URL = 'https://cmwtceczabbszhdgvwcj.supabase.co';
const SB_KEY = 'sb_publishable_hDrADaLoZfAGDJH1i_JeHw_OSv_oqAu';
const TABLE  = 'ledger_entries';

const EXP_CATS = [
  { key:'食',  emoji:'🍜' }, { key:'衣',  emoji:'👕' },
  { key:'住',  emoji:'🏠' }, { key:'行',  emoji:'🚗' },
  { key:'育',  emoji:'📚' }, { key:'樂',  emoji:'🎮' },
  { key:'醫',  emoji:'💊' }, { key:'其他', emoji:'📦' },
];
const INC_CATS = [
  { key:'固定收入', emoji:'💰' },
  { key:'快樂錢',  emoji:'🎉' },
];

// ─── State ────────────────────────────────────────────────────────────────────
let allEntries = [];
let viewDate   = new Date();
let viewMonth  = new Date();
let curType    = 'expense';
let selCat     = EXP_CATS[0].key;
let amtStr     = '0';
let barChart   = null;
let pieChart   = null;
let sbClient   = null;

// ─── Date helpers ─────────────────────────────────────────────────────────────
const DAY_NAMES = ['日','一','二','三','四','五','六'];
const ymd = d =>
  d.getFullYear() + '-' +
  String(d.getMonth()+1).padStart(2,'0') + '-' +
  String(d.getDate()).padStart(2,'0');

const fmtDate = ds => {
  const d = new Date(ds + 'T00:00:00');
  return `${d.getMonth()+1}月${d.getDate()}日 （${DAY_NAMES[d.getDay()]}）`;
};
const fmtMonth = d => `${d.getFullYear()}年${d.getMonth()+1}月`;
const fmtAmt   = n => Number(n).toLocaleString('zh-TW');

// ─── Supabase REST helpers ────────────────────────────────────────────────────
async function sbReq(method, path, body) {
  const res = await fetch(`${SB_URL}/rest/v1/${path}`, {
    method,
    headers: {
      apikey: SB_KEY,
      Authorization: `Bearer ${SB_KEY}`,
      'Content-Type': 'application/json',
      ...(method === 'POST' ? { Prefer: 'return=representation' } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) throw new Error(await res.text());
  return method === 'DELETE' ? null : res.json();
}

async function loadAll() {
  try {
    allEntries = await sbReq('GET', `${TABLE}?select=*&order=created_at.desc`);
    renderAll();
  } catch(e) {
    showErr('載入失敗：' + e.message);
  }
}

async function saveEntry(entry) {
  const [saved] = await sbReq('POST', TABLE, entry);
  allEntries.unshift(saved);
  renderAll();
}

async function deleteEntry(id) {
  await sbReq('DELETE', `${TABLE}?id=eq.${id}`);
  allEntries = allEntries.filter(e => e.id !== id);
  renderAll();
}

// ─── Realtime ─────────────────────────────────────────────────────────────────
function setupRealtime() {
  sbClient = supabase.createClient(SB_URL, SB_KEY);
  sbClient.channel('ledger-sync')
    .on('postgres_changes', { event: '*', schema: 'public', table: TABLE }, ({ eventType, new: n, old: o }) => {
      if (eventType === 'INSERT' && !allEntries.find(e => e.id === n.id)) {
        allEntries.unshift(n);
        renderAll();
      } else if (eventType === 'DELETE') {
        allEntries = allEntries.filter(e => e.id !== o.id);
        renderAll();
      }
    })
    .subscribe();
}

// ─── Render ───────────────────────────────────────────────────────────────────
function renderAll() {
  renderToday();
  if (document.getElementById('tab-monthly').classList.contains('active')) renderMonthly();
  if (document.getElementById('tab-ledger').classList.contains('active'))  renderLedger();
}

/* ── 今日 ── */
function renderToday() {
  const ds = ymd(viewDate);
  document.getElementById('today-label').textContent = fmtDate(ds);

  const entries = allEntries.filter(e => e.date === ds);
  const exp = entries.filter(e => e.type === 'expense').reduce((s,e) => s + +e.amount, 0);
  const inc = entries.filter(e => e.type === 'income' ).reduce((s,e) => s + +e.amount, 0);
  const bal = inc - exp;

  document.getElementById('today-summary').innerHTML = `
    <div class="si"><div class="slabel">支出</div><div class="samt exp">$${fmtAmt(exp)}</div></div>
    <div class="si"><div class="slabel">收入</div><div class="samt inc">$${fmtAmt(inc)}</div></div>
    <div class="si"><div class="slabel">結餘</div><div class="samt bal" style="color:${bal>=0?'var(--green)':'var(--red)'}">$${fmtAmt(bal)}</div></div>
  `;

  document.getElementById('today-entries').innerHTML = entries.length
    ? entries.map(renderEntry).join('')
    : `<div class="entries-empty"><div class="eicon">✍️</div>今天還沒有記錄</div>`;
}

/* ── 月報 ── */
function renderMonthly() {
  const y = viewMonth.getFullYear(), m = viewMonth.getMonth();
  document.getElementById('month-label').textContent = fmtMonth(viewMonth);

  const prefix  = `${y}-${String(m+1).padStart(2,'0')}`;
  const entries = allEntries.filter(e => e.date.startsWith(prefix));
  const exp     = entries.filter(e => e.type==='expense').reduce((s,e)=>s+ +e.amount,0);
  const inc     = entries.filter(e => e.type==='income' ).reduce((s,e)=>s+ +e.amount,0);
  const bal     = inc - exp;

  document.getElementById('month-summary').innerHTML = `
    <div class="mrow"><span>支出</span><span style="color:var(--red);font-weight:600">$${fmtAmt(exp)}</span></div>
    <div class="mrow"><span>收入</span><span style="color:var(--green);font-weight:600">$${fmtAmt(inc)}</span></div>
    <div class="mrow mtotal"><span>結餘</span><span style="color:${bal>=0?'var(--green)':'var(--red)'}">$${fmtAmt(bal)}</span></div>
  `;

  renderBarChart(entries, y, m);
  renderPieChart(entries);
  renderCatBreakdown(entries);
}

function renderBarChart(entries, y, m) {
  const days = new Date(y, m+1, 0).getDate();
  const data  = Array(days).fill(0);
  entries.filter(e => e.type==='expense').forEach(e => {
    const d = +e.date.split('-')[2] - 1;
    data[d] += +e.amount;
  });
  const ctx = document.getElementById('bar-chart').getContext('2d');
  if (barChart) barChart.destroy();
  barChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: Array.from({length:days},(_,i)=>i+1),
      datasets: [{ data, backgroundColor:'rgba(255,82,82,0.7)', borderColor:'#FF5252',
                   borderWidth:1, borderRadius:3 }],
    },
    options: {
      responsive: true,
      plugins: { legend:{ display:false } },
      scales: {
        x: { grid:{ display:false }, ticks:{ font:{size:10} } },
        y: { beginAtZero:true,
             ticks:{ font:{size:10}, callback:v => v>=1000 ? (v/1000).toFixed(0)+'k' : v } },
      },
    },
  });
}

function renderPieChart(entries) {
  const expMap = {};
  entries.filter(e=>e.type==='expense').forEach(e => {
    expMap[e.category] = (expMap[e.category]||0) + +e.amount;
  });
  const labels = Object.keys(expMap);
  const values = labels.map(k => expMap[k]);
  const COLORS = ['#FF5252','#FF7043','#FFA726','#FFCA28','#66BB6A','#26C6DA','#42A5F5','#AB47BC'];
  const ctx = document.getElementById('pie-chart').getContext('2d');
  if (pieChart) pieChart.destroy();

  if (!labels.length) {
    ctx.clearRect(0,0,400,200);
    ctx.fillStyle='#BDBDBD'; ctx.font='14px sans-serif';
    ctx.textAlign='center'; ctx.fillText('本月尚無支出記錄',200,105);
    return;
  }
  pieChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data:values,
                   backgroundColor: COLORS.slice(0,labels.length),
                   borderWidth:2, borderColor:'white' }],
    },
    options: {
      responsive: true,
      plugins: { legend:{ position:'bottom', labels:{ font:{size:12}, padding:12 } } },
    },
  });
}

function renderCatBreakdown(entries) {
  const expMap = {};
  entries.filter(e=>e.type==='expense').forEach(e => {
    expMap[e.category] = (expMap[e.category]||0) + +e.amount;
  });
  const sorted = Object.entries(expMap).sort((a,b)=>b[1]-a[1]);
  const total  = sorted.reduce((s,[,v])=>s+v,0) || 1;

  const el = document.getElementById('cat-breakdown');
  if (!sorted.length) {
    el.innerHTML = '<div style="text-align:center;color:#BDBDBD;padding:16px;font-size:13px">尚無支出記錄</div>';
    return;
  }
  el.innerHTML = `
    <div class="chart-hdg">支出明細</div>
    ${sorted.map(([cat,amt]) => {
      const info = EXP_CATS.find(c=>c.key===cat) || { emoji:'📦' };
      return `
        <div class="cat-row">
          <div class="cr-icon">${info.emoji}</div>
          <div class="cr-name">${cat}</div>
          <div class="cr-bar-wrap"><div class="cr-bar" style="width:${Math.round(amt/total*100)}%"></div></div>
          <div class="cr-amt">$${fmtAmt(amt)}</div>
        </div>`;
    }).join('')}`;
}

/* ── 帳本 ── */
function renderLedger() {
  const grouped = {};
  allEntries.forEach(e => { (grouped[e.date] ??= []).push(e); });
  const dates = Object.keys(grouped).sort().reverse();

  if (!dates.length) {
    document.getElementById('ledger-list').innerHTML =
      `<div class="entries-empty" style="padding:80px 20px"><div class="eicon">📒</div>還沒有任何記錄</div>`;
    return;
  }

  document.getElementById('ledger-list').innerHTML = dates.map(ds => {
    const dayEnts = grouped[ds];
    const exp = dayEnts.filter(e=>e.type==='expense').reduce((s,e)=>s+ +e.amount,0);
    const inc = dayEnts.filter(e=>e.type==='income' ).reduce((s,e)=>s+ +e.amount,0);
    return `
      <div class="ledger-group">
        <div class="ldg-date-row">
          <div class="ldg-date">${fmtDate(ds)}</div>
          <div class="ldg-total">
            ${inc>0?`<span style="color:var(--green)">+$${fmtAmt(inc)} </span>`:''}
            ${exp>0?`<span style="color:var(--red)">-$${fmtAmt(exp)}</span>`:''}
          </div>
        </div>
        ${dayEnts.map(renderEntry).join('')}
      </div>`;
  }).join('');
}

function renderEntry(e) {
  const cats  = e.type==='expense' ? EXP_CATS : INC_CATS;
  const info  = cats.find(c=>c.key===e.category) || { emoji:'📦' };
  const sign  = e.type==='expense' ? '-' : '+';
  const cls   = e.type==='expense' ? 'exp' : 'inc';
  return `
    <div class="entry-item">
      <div class="ent-icon ${cls}">${info.emoji}</div>
      <div class="ent-body">
        <div class="ent-cat">${e.category}</div>
        ${e.note ? `<div class="ent-note">${e.note}</div>` : ''}
      </div>
      <div class="ent-amt ${cls}">${sign}$${fmtAmt(e.amount)}</div>
      <button class="ent-del" onclick="confirmDel('${e.id}')">✕</button>
    </div>`;
}

// ─── Sheet ────────────────────────────────────────────────────────────────────
function openSheet() {
  amtStr = '0';
  document.getElementById('note-inp').value = '';
  document.getElementById('amt-display').textContent = '0';
  document.getElementById('overlay').classList.add('open');
}
function closeSheet() {
  document.getElementById('overlay').classList.remove('open');
}

document.getElementById('fab-btn').addEventListener('click', openSheet);
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeSheet();
});

// Type toggle
document.querySelectorAll('.type-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    curType = btn.dataset.type;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const cls = curType === 'expense' ? 'exp' : 'inc';
    document.getElementById('amt-display').className = `amt-display ${cls}`;
    document.getElementById('save-btn').className    = `nk save ${cls}`;
    buildCatGrid();
  });
});

function buildCatGrid() {
  const cats = curType === 'expense' ? EXP_CATS : INC_CATS;
  selCat = cats[0].key;
  const cls = curType === 'expense' ? 'exp' : 'inc';
  document.getElementById('cat-grid').innerHTML = cats.map(c => `
    <button class="cat-btn${c.key===selCat?' sel '+cls:''}" data-cat="${c.key}">
      <span class="cat-emoji">${c.emoji}</span>
      <span class="cat-name">${c.key}</span>
    </button>`).join('');
  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      selCat = btn.dataset.cat;
      const cls2 = curType==='expense'?'exp':'inc';
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('sel','exp','inc'));
      btn.classList.add('sel', cls2);
    });
  });
}

// Numpad
document.querySelectorAll('.nk').forEach(btn => {
  const k = btn.dataset.k;
  if (!k) return;
  btn.addEventListener('click', () => {
    if (k === 'del') {
      amtStr = amtStr.length > 1 ? amtStr.slice(0,-1) : '0';
    } else {
      if (amtStr === '0') amtStr = k;
      else {
        const [, dec] = amtStr.split('.');
        if (dec !== undefined && dec.length >= 0) {
          if (k === '.' && amtStr.includes('.')) return;
          if (amtStr.includes('.') && dec.length >= 2) return;
        }
        amtStr += k;
      }
    }
    document.getElementById('amt-display').textContent = amtStr;
  });
});

document.getElementById('save-btn').addEventListener('click', async () => {
  const amt = parseFloat(amtStr);
  if (!amt || amt <= 0) { alert('請輸入金額'); return; }
  const btn = document.getElementById('save-btn');
  btn.textContent = '…'; btn.disabled = true;
  try {
    await saveEntry({
      type: curType,
      amount: amt,
      category: selCat,
      note: document.getElementById('note-inp').value.trim(),
      date: ymd(viewDate),
    });
    closeSheet();
  } catch(e) {
    alert('儲存失敗：' + e.message);
  } finally {
    btn.textContent = '確認'; btn.disabled = false;
  }
});

// ─── Date nav ─────────────────────────────────────────────────────────────────
document.getElementById('prev-day').addEventListener('click', () => {
  viewDate.setDate(viewDate.getDate()-1); renderToday();
});
document.getElementById('next-day').addEventListener('click', () => {
  viewDate.setDate(viewDate.getDate()+1); renderToday();
});
document.getElementById('prev-month').addEventListener('click', () => {
  viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth()-1, 1);
  renderMonthly();
});
document.getElementById('next-month').addEventListener('click', () => {
  viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth()+1, 1);
  renderMonthly();
});

// ─── Tab switching ────────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab-item, .bnav-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === name)
  );
  document.querySelectorAll('.page').forEach(p =>
    p.classList.toggle('active', p.id === 'tab-'+name)
  );
  if (name === 'monthly') renderMonthly();
  if (name === 'ledger')  renderLedger();
}
document.querySelectorAll('.tab-item, .bnav-btn').forEach(btn =>
  btn.addEventListener('click', () => switchTab(btn.dataset.tab))
);

// ─── Delete ───────────────────────────────────────────────────────────────────
async function confirmDel(id) {
  if (!confirm('確定刪除這筆記錄？')) return;
  try { await deleteEntry(id); }
  catch(e) { alert('刪除失敗：' + e.message); }
}

// ─── Error display ────────────────────────────────────────────────────────────
function showErr(msg) {
  document.getElementById('today-entries').innerHTML =
    `<div class="err-box">⚠️ ${msg}<br><small>請確認 Supabase ledger_entries 資料表已建立</small></div>`;
}

// ─── Init ─────────────────────────────────────────────────────────────────────
buildCatGrid();
renderToday();
loadAll().then(() => setupRealtime());
</script>
</body>
</html>
