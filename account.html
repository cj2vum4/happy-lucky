<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>每日記帳</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
:root {
  --accent: #FF5252;
  --accent-d: #E53935;
  --accent-g: #43A047;
  --accent-g-d: #388E3C;
  --bg: #F4F6FA;
  --card: #FFFFFF;
  --text: #1C1C1E;
  --text2: #8A8A8E;
  --text3: #C7C7CC;
  --border: #EBEBF0;
  --shadow: 0 2px 16px rgba(0,0,0,0.08);
  --shadow-sm: 0 1px 6px rgba(0,0,0,0.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, 'SF Pro Text', 'PingFang TC', 'Noto Sans TC', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}

/* ─── App shell ──────────────────────────────────────────────── */
.app {
  max-width: 430px;
  margin: 0 auto;
  height: 100svh;
  display: flex; flex-direction: column;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}

/* ─── Header ─────────────────────────────────────────────────── */
.hdr {
  flex-shrink: 0;
  background: linear-gradient(150deg, #FF6B6B 0%, #FF5252 60%, #E53935 100%);
  padding: 48px 20px 0;
  position: relative;
  overflow: hidden;
}
.hdr::before {
  content: '';
  position: absolute;
  top: -40px; right: -30px;
  width: 160px; height: 160px;
  background: rgba(255,255,255,0.08);
  border-radius: 50%;
}
.hdr::after {
  content: '';
  position: absolute;
  bottom: 20px; left: -50px;
  width: 120px; height: 120px;
  background: rgba(255,255,255,0.06);
  border-radius: 50%;
}
.hdr-row {
  display: flex; align-items: center;
  justify-content: center;
  padding-bottom: 4px;
  position: relative; z-index: 1;
}
.back-btn {
  position: absolute; left: 0;
  background: rgba(255,255,255,0.2);
  border: none; border-radius: 50%;
  width: 32px; height: 32px;
  color: white; font-size: 20px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(8px);
}
.hdr-title {
  font-size: 17px; font-weight: 700;
  color: white; letter-spacing: 0.5px;
}

/* ─── Top tabs ───────────────────────────────────────────────── */
.tab-bar {
  display: flex;
  position: relative; z-index: 1;
  margin-top: 10px;
}
.tab-item {
  flex: 1; padding: 10px 0 14px;
  font-size: 13px; font-weight: 500;
  color: rgba(255,255,255,0.6);
  cursor: pointer; border: none; background: none;
  font-family: inherit;
  border-bottom: 2.5px solid transparent;
  transition: all 0.2s;
  position: relative;
}
.tab-item.active {
  color: white; font-weight: 700;
  border-bottom-color: white;
}

/* ─── Scrollable pages ───────────────────────────────────────── */
.pages {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}
.page { display: none; padding-bottom: 110px; }
.page.active { display: block; }

/* ─── Date nav ───────────────────────────────────────────────── */
.date-nav {
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
}
.date-nav button {
  background: var(--bg); border: none;
  width: 34px; height: 34px; border-radius: 50%;
  color: var(--text2); font-size: 18px;
  cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  transition: background 0.15s;
}
.date-nav button:active { background: var(--border); }
.dlabel {
  font-size: 15px; font-weight: 700;
  color: var(--text); text-align: center;
}
.dlabel.tappable { cursor: pointer; }
.dlabel.tappable:active { color: var(--accent); }
.pick-hint {
  font-size: 11px; color: var(--accent);
  margin-left: 4px; vertical-align: middle;
}

/* ─── Summary card (today) ───────────────────────────────────── */
.summary-card {
  margin: 14px 16px;
  background: var(--card);
  border-radius: 18px;
  padding: 18px 8px;
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  text-align: center;
  box-shadow: var(--shadow);
}
.si + .si { border-left: 1px solid var(--border); }
.slabel { font-size: 11px; color: var(--text2); margin-bottom: 6px; letter-spacing: 0.3px; }
.samt {
  font-size: 18px; font-weight: 800;
  letter-spacing: -0.5px;
}
.samt.exp { color: var(--accent); }
.samt.inc { color: var(--accent-g); }
.samt.bal { color: var(--text); }

/* ─── Entry list ─────────────────────────────────────────────── */
.entries-wrap { padding: 0 16px 8px; }
.entries-empty {
  text-align: center; padding: 60px 20px;
  color: var(--text3); font-size: 14px;
}
.entries-empty .eicon { font-size: 48px; margin-bottom: 12px; display: block; }

.entry-item {
  background: var(--card); border-radius: 14px;
  padding: 13px 14px; margin-bottom: 9px;
  display: flex; align-items: center; gap: 13px;
  box-shadow: var(--shadow-sm);
  transition: transform 0.15s;
}
.entry-item:active { transform: scale(0.98); }
.ent-icon {
  width: 44px; height: 44px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.ent-body { flex: 1; min-width: 0; }
.ent-cat { font-size: 14px; font-weight: 600; margin-bottom: 1px; }
.ent-note {
  font-size: 12px; color: var(--text2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ent-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.ent-amt { font-size: 16px; font-weight: 800; letter-spacing: -0.3px; }
.ent-amt.exp { color: var(--accent); }
.ent-amt.inc { color: var(--accent-g); }
.ent-del {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--bg); border: none;
  color: var(--text3); font-size: 12px;
  cursor: pointer; display: flex;
  align-items: center; justify-content: center;
}
.ent-del:active { background: #FFE5E5; color: var(--accent); }
.entry-item { cursor: pointer; }

/* Sheet mode label */
.sheet-mode {
  text-align: center;
  font-size: 12px; font-weight: 700; letter-spacing: 0.8px;
  text-transform: uppercase; color: var(--text2);
  padding: 2px 0 4px;
}
.sheet-mode.editing { color: var(--accent); }

/* ─── Month summary card ─────────────────────────────────────── */
.month-card {
  margin: 14px 16px;
  background: var(--card); border-radius: 18px;
  padding: 18px 20px; box-shadow: var(--shadow);
}
.mrow {
  display: flex; justify-content: space-between;
  align-items: center; padding: 7px 0;
  font-size: 14px;
}
.mrow:not(:last-child) { border-bottom: 1px solid var(--border); }
.mrow.mtotal { font-weight: 700; font-size: 16px; }

/* ─── Chart cards ────────────────────────────────────────────── */
.chart-card {
  margin: 0 16px 14px;
  background: var(--card); border-radius: 18px;
  padding: 18px; box-shadow: var(--shadow);
}
.chart-hdg {
  font-size: 12px; font-weight: 700;
  color: var(--text2); letter-spacing: 0.8px;
  text-transform: uppercase; margin-bottom: 14px;
}

/* ─── Category breakdown ─────────────────────────────────────── */
.cat-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.cat-row:last-child { border-bottom: none; }
.cr-icon { font-size: 20px; width: 32px; text-align: center; flex-shrink: 0; }
.cr-name { flex: 1; font-size: 14px; font-weight: 500; }
.cr-bar-wrap { width: 64px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.cr-bar { height: 100%; border-radius: 2px; }
.cr-amt { font-size: 14px; font-weight: 700; min-width: 75px; text-align: right; }

/* ─── Ledger tab ─────────────────────────────────────────────── */
.ledger-group { padding: 12px 16px 0; }
.ldg-date-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 4px 2px 10px;
}
.ldg-date { font-size: 12px; font-weight: 700; color: var(--text2); letter-spacing: 0.3px; }
.ldg-totals { font-size: 12px; color: var(--text2); display: flex; gap: 8px; }

/* ─── Bottom nav ─────────────────────────────────────────────── */
.bottom-nav {
  flex-shrink: 0; display: flex;
  background: var(--card);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.bnav-btn {
  flex: 1; padding: 9px 0 6px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: none; border: none; cursor: pointer;
  font-family: inherit; color: var(--text3);
  font-size: 10px; font-weight: 500;
  transition: color 0.2s;
}
.bnav-btn .ni { font-size: 24px; line-height: 1; }
.bnav-btn.active { color: var(--accent); }

/* ─── FAB ────────────────────────────────────────────────────── */
.fab {
  position: absolute; bottom: 68px; right: 20px;
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, #FF6B6B, #FF5252);
  color: white; border: none; font-size: 28px;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(255,82,82,0.5);
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.15s, box-shadow 0.15s;
  z-index: 100;
}
.fab:active { transform: scale(0.90); box-shadow: 0 2px 10px rgba(255,82,82,0.3); }

/* ─── Bottom sheet overlay ───────────────────────────────────── */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 300; align-items: flex-end; justify-content: center;
  backdrop-filter: blur(2px);
}
.overlay.open { display: flex; }
.sheet {
  width: 100%; max-width: 430px;
  background: var(--card); border-radius: 24px 24px 0 0;
  padding-bottom: max(env(safe-area-inset-bottom, 0px), 16px);
  animation: slideUp 0.3s cubic-bezier(0.32,0.72,0,1);
  overflow: hidden;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to   { transform: translateY(0); }
}
.sheet-handle {
  text-align: center; padding: 12px 0 6px;
  cursor: grab;
}
.sheet-handle::before {
  content: '';
  display: inline-block; width: 36px; height: 4px;
  background: var(--border); border-radius: 2px;
}

/* Type toggle */
.type-toggle {
  display: flex; margin: 8px 16px 4px;
  background: var(--bg); border-radius: 12px; padding: 3px;
}
.type-btn {
  flex: 1; padding: 10px;
  border: none; background: none; border-radius: 10px;
  font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all 0.25s;
  font-family: inherit; color: var(--text2);
}
.type-btn.active.exp {
  background: var(--accent); color: white;
  box-shadow: 0 3px 10px rgba(255,82,82,0.4);
}
.type-btn.active.inc {
  background: var(--accent-g); color: white;
  box-shadow: 0 3px 10px rgba(67,160,71,0.4);
}

/* Amount display */
.amt-wrap {
  padding: 8px 20px 4px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: baseline;
  justify-content: flex-end; gap: 4px;
}
.amt-currency {
  font-size: 22px; font-weight: 700;
  color: var(--text3);
}
.amt-display {
  font-size: 40px; font-weight: 800;
  letter-spacing: -1px; line-height: 1.1;
  min-width: 80px; text-align: right;
  transition: color 0.2s;
}
.amt-display.exp { color: var(--accent); }
.amt-display.inc { color: var(--accent-g); }

/* Category grid */
.cat-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 8px; padding: 10px 14px 6px;
}
.cat-btn {
  display: flex; flex-direction: column;
  align-items: center; gap: 5px;
  padding: 10px 4px 8px;
  background: var(--bg);
  border: 2px solid transparent;
  border-radius: 14px; cursor: pointer;
  transition: all 0.18s; font-family: inherit;
  position: relative;
}
.cat-btn:active { transform: scale(0.94); }
.cat-icon-wrap {
  width: 44px; height: 44px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  transition: transform 0.18s;
}
.cat-btn:active .cat-icon-wrap { transform: scale(0.9); }
.cat-name { font-size: 11px; color: var(--text2); font-weight: 500; }

/* Selected state */
.cat-btn.sel { border-color: transparent; }
.cat-btn.sel .cat-name { font-weight: 700; }
.cat-btn.sel.exp { background: #FFF0F0; border-color: var(--accent); }
.cat-btn.sel.inc { background: #F0FAF0; border-color: var(--accent-g); }
.cat-btn.sel .cat-name { color: var(--text); }

/* Note input */
.note-inp {
  margin: 6px 16px;
  padding: 11px 14px;
  background: var(--bg); border: 1.5px solid var(--border);
  border-radius: 12px; font-size: 14px;
  font-family: inherit; color: var(--text);
  width: calc(100% - 32px); outline: none;
  transition: border-color 0.2s;
}
.note-inp:focus { border-color: var(--accent); background: white; }

/* Numpad */
.numpad {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1px; background: var(--border);
  border-top: 1px solid var(--border); margin-top: 8px;
}
.nk {
  background: white; border: none;
  padding: 18px; font-size: 22px;
  font-family: inherit; cursor: pointer;
  color: var(--text); font-weight: 500;
  transition: background 0.1s;
  line-height: 1;
}
.nk:active { background: var(--bg); }
.nk.del { color: var(--text2); font-size: 18px; }
.nk.save {
  font-size: 16px; font-weight: 800; letter-spacing: 0.5px;
}
.nk.save.exp { background: var(--accent); color: white; }
.nk.save.inc { background: var(--accent-g); color: white; }
.nk.save:active { opacity: 0.85; }

/* Error / loading */
.entries-loading { text-align:center; padding:40px; color:var(--text3); font-size:14px; }
.err-box {
  margin:16px; padding:14px 16px;
  background:#FFF0F0; border-radius:12px;
  font-size:13px; color:#C62828; line-height:1.6;
  border: 1px solid rgba(255,82,82,0.2);
}
</style>
</head>
<body>
<div class="app">

  <div class="hdr">
    <div class="hdr-row">
      <a href="index.html" class="back-btn">‹</a>
      <div class="hdr-title">每日記帳</div>
    </div>
    <div class="tab-bar">
      <button class="tab-item active" data-tab="today">今日</button>
      <button class="tab-item" data-tab="monthly">月報</button>
      <button class="tab-item" data-tab="ledger">帳本</button>
    </div>
  </div>

  <div class="pages">

    <!-- 今日 -->
    <div id="tab-today" class="page active">
      <div class="date-nav">
        <button id="prev-day">‹</button>
        <div class="dlabel tappable" id="today-label" onclick="document.getElementById('date-picker').showPicker?.() || document.getElementById('date-picker').click()">—<span class="pick-hint">▾</span></div>
        <button id="next-day">›</button>
      </div>
      <input type="date" id="date-picker" style="position:absolute;opacity:0;pointer-events:none;width:0;height:0;" onchange="pickDate(this.value)">
      <div class="summary-card" id="today-summary"></div>
      <div class="entries-wrap" id="today-entries">
        <div class="entries-loading">載入中…</div>
      </div>
    </div>

    <!-- 月報 -->
    <div id="tab-monthly" class="page">
      <div class="date-nav">
        <button id="prev-month">‹</button>
        <div class="dlabel" id="month-label">—</div>
        <button id="next-month">›</button>
      </div>
      <div class="month-card" id="month-summary"></div>
      <div class="chart-card" style="margin-top:14px">
        <div class="chart-hdg">每日支出</div>
        <canvas id="bar-chart" height="130"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-hdg">支出分類佔比</div>
        <canvas id="pie-chart" height="210"></canvas>
      </div>
      <div class="chart-card" id="cat-breakdown"></div>
    </div>

    <!-- 帳本 -->
    <div id="tab-ledger" class="page">
      <div id="ledger-list"></div>
    </div>

  </div><!-- .pages -->

  <div class="bottom-nav">
    <button class="bnav-btn active" data-tab="today"><span class="ni">📅</span>今日</button>
    <button class="bnav-btn" data-tab="monthly"><span class="ni">📊</span>月報</button>
    <button class="bnav-btn" data-tab="ledger"><span class="ni">📒</span>帳本</button>
  </div>

  <button class="fab" id="fab-btn">＋</button>

</div><!-- .app -->

<!-- Add entry bottom sheet -->
<div class="overlay" id="overlay">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-mode" id="sheet-mode">新增記錄</div>
    <div class="type-toggle">
      <button class="type-btn active exp" data-type="expense">💸 支出</button>
      <button class="type-btn inc" data-type="income">💰 收入</button>
    </div>
    <div class="amt-wrap">
      <span class="amt-currency">$</span>
      <div class="amt-display exp" id="amt-display">0</div>
    </div>
    <div class="cat-grid" id="cat-grid"></div>
    <input class="note-inp" id="note-inp" placeholder="✏️ 備註（選填）" maxlength="50" autocomplete="off">
    <div class="numpad">
      <button class="nk" data-k="7">7</button>
      <button class="nk" data-k="8">8</button>
      <button class="nk" data-k="9">9</button>
      <button class="nk" data-k="4">4</button>
      <button class="nk" data-k="5">5</button>
      <button class="nk" data-k="6">6</button>
      <button class="nk" data-k="1">1</button>
      <button class="nk" data-k="2">2</button>
      <button class="nk" data-k="3">3</button>
      <button class="nk del" data-k="del">⌫</button>
      <button class="nk" data-k="0">0</button>
      <button class="nk save exp" id="save-btn">確認</button>
    </div>
  </div>
</div>

<script>
// ─── Config ──────────────────────────────────────────────────────────────────
const SB_URL = 'https://cmwtceczabbszhdgvwcj.supabase.co';
const SB_KEY = 'sb_publishable_hDrADaLoZfAGDJH1i_JeHw_OSv_oqAu';
const TABLE  = 'ledger_entries';

// Each category has emoji + background color + accent color
const EXP_CATS = [
  { key:'食',  emoji:'🍜', bg:'#FFF3E0', accent:'#FF8F00' },
  { key:'衣',  emoji:'👗', bg:'#E3F2FD', accent:'#1E88E5' },
  { key:'住',  emoji:'🏠', bg:'#E8F5E9', accent:'#43A047' },
  { key:'行',  emoji:'🚗', bg:'#F3E5F5', accent:'#8E24AA' },
  { key:'育',  emoji:'📚', bg:'#E0F7FA', accent:'#00ACC1' },
  { key:'樂',  emoji:'🎮', bg:'#FFF8E1', accent:'#F9A825' },
  { key:'醫',  emoji:'💊', bg:'#FCE4EC', accent:'#E53935' },
  { key:'其他',emoji:'📦', bg:'#ECEFF1', accent:'#607D8B' },
];
const INC_CATS = [
  { key:'固定收入', emoji:'💼', bg:'#E8F5E9', accent:'#43A047' },
  { key:'快樂錢',  emoji:'🎉', bg:'#FFF9C4', accent:'#F9A825' },
];

// ─── State ───────────────────────────────────────────────────────────────────
let allEntries = [];
let viewDate   = new Date();
let viewMonth  = new Date();
let curType    = 'expense';
let selCat     = EXP_CATS[0].key;
let amtStr     = '0';
let barChart   = null;
let pieChart   = null;
let editingId  = null;   // null = add mode, string = edit mode

// ─── Date helpers ─────────────────────────────────────────────────────────────
const DAY_NAMES = ['日','一','二','三','四','五','六'];
const ymd = d =>
  `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtDate = ds => {
  const d = new Date(ds + 'T00:00:00');
  const isToday = ymd(new Date()) === ds;
  return isToday
    ? `今天 ${d.getMonth()+1}/${d.getDate()} (${DAY_NAMES[d.getDay()]})`
    : `${d.getMonth()+1}月${d.getDate()}日 (${DAY_NAMES[d.getDay()]})`;
};
const fmtMonth = d => `${d.getFullYear()} 年 ${d.getMonth()+1} 月`;
const fmtAmt   = n => Number(n).toLocaleString('zh-TW');

// ─── Supabase REST ────────────────────────────────────────────────────────────
async function sbReq(method, path, body) {
  const res = await fetch(`${SB_URL}/rest/v1/${path}`, {
    method,
    headers: {
      apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`,
      'Content-Type': 'application/json',
      ...(['POST','PATCH'].includes(method) ? { Prefer: 'return=representation' } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) throw new Error(await res.text());
  return method === 'DELETE' ? null : res.json();
}

async function loadAll() {
  try {
    allEntries = await sbReq('GET', `${TABLE}?select=*&order=created_at.desc`);
    renderAll();
  } catch(e) {
    document.getElementById('today-entries').innerHTML =
      `<div class="err-box">⚠️ 載入失敗：${e.message}<br><small>請確認 Supabase ledger_entries 資料表已建立</small></div>`;
  }
}

async function saveEntry(entry) {
  const [saved] = await sbReq('POST', TABLE, entry);
  allEntries.unshift(saved);
  renderAll();
}

async function deleteEntry(id) {
  await sbReq('DELETE', `${TABLE}?id=eq.${id}`);
  allEntries = allEntries.filter(e => e.id !== id);
  renderAll();
}

async function updateEntry(id, data) {
  const [updated] = await sbReq('PATCH', `${TABLE}?id=eq.${id}`, data);
  const idx = allEntries.findIndex(e => e.id === id);
  if (idx !== -1) allEntries[idx] = updated;
  renderAll();
}

// ─── Realtime ─────────────────────────────────────────────────────────────────
function setupRealtime() {
  const sb = supabase.createClient(SB_URL, SB_KEY);
  sb.channel('ledger-sync')
    .on('postgres_changes', { event:'*', schema:'public', table:TABLE }, ({ eventType, new:n, old:o }) => {
      if (eventType === 'INSERT' && !allEntries.find(e => e.id === n.id)) {
        allEntries.unshift(n); renderAll();
      } else if (eventType === 'DELETE') {
        allEntries = allEntries.filter(e => e.id !== o.id); renderAll();
      }
    })
    .subscribe();
}

// ─── Render ───────────────────────────────────────────────────────────────────
function renderAll() {
  renderToday();
  if (document.getElementById('tab-monthly').classList.contains('active')) renderMonthly();
  if (document.getElementById('tab-ledger').classList.contains('active'))  renderLedger();
}

/* ── 今日 ─────────────────────────────────────────────────────── */
function renderToday() {
  const ds      = ymd(viewDate);
  document.getElementById('today-label').textContent = fmtDate(ds);
  const entries = allEntries.filter(e => e.date === ds);
  const exp     = entries.filter(e => e.type==='expense').reduce((s,e)=>s+ +e.amount, 0);
  const inc     = entries.filter(e => e.type==='income' ).reduce((s,e)=>s+ +e.amount, 0);
  const bal     = inc - exp;

  document.getElementById('today-summary').innerHTML = `
    <div class="si">
      <div class="slabel">支出</div>
      <div class="samt exp">$${fmtAmt(exp)}</div>
    </div>
    <div class="si">
      <div class="slabel">收入</div>
      <div class="samt inc">$${fmtAmt(inc)}</div>
    </div>
    <div class="si">
      <div class="slabel">結餘</div>
      <div class="samt bal" style="color:${bal>=0?'var(--accent-g)':'var(--accent)'}">$${fmtAmt(bal)}</div>
    </div>`;

  document.getElementById('today-entries').innerHTML = entries.length
    ? entries.map(renderEntry).join('')
    : `<div class="entries-empty"><span class="eicon">✍️</span>今天還沒有記錄<br>點擊右下角 ＋ 開始記帳</div>`;
}

/* ── 月報 ─────────────────────────────────────────────────────── */
function renderMonthly() {
  const y = viewMonth.getFullYear(), m = viewMonth.getMonth();
  document.getElementById('month-label').textContent = fmtMonth(viewMonth);
  const prefix  = `${y}-${String(m+1).padStart(2,'0')}`;
  const entries = allEntries.filter(e => e.date.startsWith(prefix));
  const exp     = entries.filter(e=>e.type==='expense').reduce((s,e)=>s+ +e.amount,0);
  const inc     = entries.filter(e=>e.type==='income' ).reduce((s,e)=>s+ +e.amount,0);
  const bal     = inc - exp;

  document.getElementById('month-summary').innerHTML = `
    <div class="mrow">
      <span>💸 支出</span>
      <span style="color:var(--accent);font-weight:700">$${fmtAmt(exp)}</span>
    </div>
    <div class="mrow">
      <span>💰 收入</span>
      <span style="color:var(--accent-g);font-weight:700">$${fmtAmt(inc)}</span>
    </div>
    <div class="mrow mtotal">
      <span>結餘</span>
      <span style="color:${bal>=0?'var(--accent-g)':'var(--accent)'}">$${fmtAmt(bal)}</span>
    </div>`;

  renderBarChart(entries, y, m);
  renderPieChart(entries);
  renderCatBreakdown(entries);
}

function renderBarChart(entries, y, m) {
  const days = new Date(y, m+1, 0).getDate();
  const data  = Array(days).fill(0);
  entries.filter(e=>e.type==='expense').forEach(e => {
    data[+e.date.split('-')[2] - 1] += +e.amount;
  });
  const ctx = document.getElementById('bar-chart').getContext('2d');
  if (barChart) barChart.destroy();
  barChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: Array.from({length:days},(_,i)=>i+1),
      datasets: [{
        data,
        backgroundColor: data.map(v => v > 0 ? 'rgba(255,82,82,0.75)' : 'rgba(0,0,0,0.04)'),
        borderColor: data.map(v => v > 0 ? '#FF5252' : 'transparent'),
        borderWidth: 1, borderRadius: 4, borderSkipped: false,
      }],
    },
    options: {
      responsive: true,
      plugins: { legend:{ display:false }, tooltip:{
        callbacks:{ label: ctx => `$${fmtAmt(ctx.parsed.y)}` }
      }},
      scales: {
        x: { grid:{ display:false }, ticks:{ font:{size:10}, color:'#8A8A8E' } },
        y: { beginAtZero:true, grid:{ color:'rgba(0,0,0,0.04)' },
             ticks:{ font:{size:10}, color:'#8A8A8E',
                     callback:v => v>=1000 ? (v/1000).toFixed(0)+'k' : v } },
      },
    },
  });
}

function renderPieChart(entries) {
  const expMap = {};
  entries.filter(e=>e.type==='expense').forEach(e => {
    expMap[e.category] = (expMap[e.category]||0) + +e.amount;
  });
  const labels = Object.keys(expMap);
  const values = labels.map(k => expMap[k]);
  const catColors = labels.map(k => {
    const info = EXP_CATS.find(c=>c.key===k);
    return info ? info.accent : '#607D8B';
  });
  const ctx = document.getElementById('pie-chart').getContext('2d');
  if (pieChart) pieChart.destroy();
  if (!labels.length) {
    ctx.clearRect(0,0,400,210);
    ctx.fillStyle='#C7C7CC'; ctx.font='bold 14px sans-serif';
    ctx.textAlign='center'; ctx.fillText('本月尚無支出記錄',200,110);
    return;
  }
  pieChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data:values, backgroundColor:catColors,
                   borderWidth:3, borderColor:'white',
                   hoverOffset:6 }],
    },
    options: {
      responsive: true, cutout: '58%',
      plugins: {
        legend:{ position:'bottom', labels:{ font:{size:12}, padding:14, usePointStyle:true, pointStyleWidth:8 } },
        tooltip:{ callbacks:{ label: ctx => ` ${ctx.label}  $${fmtAmt(ctx.raw)}` } },
      },
    },
  });
}

function renderCatBreakdown(entries) {
  const expMap = {};
  entries.filter(e=>e.type==='expense').forEach(e => {
    expMap[e.category] = (expMap[e.category]||0) + +e.amount;
  });
  const sorted = Object.entries(expMap).sort((a,b)=>b[1]-a[1]);
  const total  = sorted.reduce((s,[,v])=>s+v,0) || 1;
  const el = document.getElementById('cat-breakdown');

  if (!sorted.length) {
    el.innerHTML = '<div style="text-align:center;color:#C7C7CC;padding:20px;font-size:13px">尚無支出記錄</div>';
    return;
  }
  el.innerHTML = `
    <div class="chart-hdg">支出明細</div>
    ${sorted.map(([cat,amt]) => {
      const info = EXP_CATS.find(c=>c.key===cat) || { emoji:'📦', accent:'#607D8B' };
      const pct  = Math.round(amt/total*100);
      return `
        <div class="cat-row">
          <div class="cr-icon">${info.emoji}</div>
          <div class="cr-name">${cat}</div>
          <div class="cr-bar-wrap">
            <div class="cr-bar" style="width:${pct}%;background:${info.accent}"></div>
          </div>
          <div class="cr-amt" style="color:${info.accent}">$${fmtAmt(amt)}</div>
        </div>`;
    }).join('')}`;
}

/* ── 帳本 ─────────────────────────────────────────────────────── */
function renderLedger() {
  const grouped = {};
  allEntries.forEach(e => { (grouped[e.date] ??= []).push(e); });
  const dates = Object.keys(grouped).sort().reverse();

  if (!dates.length) {
    document.getElementById('ledger-list').innerHTML =
      `<div class="entries-empty" style="padding:80px 20px"><span class="eicon">📒</span>還沒有任何記錄</div>`;
    return;
  }
  document.getElementById('ledger-list').innerHTML = dates.map(ds => {
    const dayEnts = grouped[ds];
    const exp = dayEnts.filter(e=>e.type==='expense').reduce((s,e)=>s+ +e.amount,0);
    const inc = dayEnts.filter(e=>e.type==='income' ).reduce((s,e)=>s+ +e.amount,0);
    return `
      <div class="ledger-group">
        <div class="ldg-date-row">
          <div class="ldg-date">${fmtDate(ds)}</div>
          <div class="ldg-totals">
            ${inc>0?`<span style="color:var(--accent-g);font-weight:600">+$${fmtAmt(inc)}</span>`:''}
            ${exp>0?`<span style="color:var(--accent);font-weight:600">-$${fmtAmt(exp)}</span>`:''}
          </div>
        </div>
        ${dayEnts.map(renderEntry).join('')}
      </div>`;
  }).join('');
}

/* ── Entry item ───────────────────────────────────────────────── */
function getCatInfo(type, key) {
  const list = type === 'expense' ? EXP_CATS : INC_CATS;
  return list.find(c=>c.key===key) || { emoji:'📦', bg:'#ECEFF1', accent:'#607D8B' };
}
function renderEntry(e) {
  const info  = getCatInfo(e.type, e.category);
  const sign  = e.type==='expense' ? '-' : '+';
  const cls   = e.type==='expense' ? 'exp' : 'inc';
  return `
    <div class="entry-item" onclick="editEntry('${e.id}')">
      <div class="ent-icon" style="background:${info.bg}">${info.emoji}</div>
      <div class="ent-body">
        <div class="ent-cat">${e.category}</div>
        ${e.note ? `<div class="ent-note">${e.note}</div>` : '<div class="ent-note" style="color:var(--text3)">點擊編輯</div>'}
      </div>
      <div class="ent-right">
        <div class="ent-amt ${cls}">${sign}$${fmtAmt(e.amount)}</div>
        <button class="ent-del" onclick="event.stopPropagation();confirmDel('${e.id}')">✕</button>
      </div>
    </div>`;
}

// ─── Sheet logic ──────────────────────────────────────────────────────────────
function openSheet(entry = null) {
  editingId = entry ? entry.id : null;

  // Set mode label
  const modeEl = document.getElementById('sheet-mode');
  modeEl.textContent = entry ? '編輯記錄' : '新增記錄';
  modeEl.className = entry ? 'sheet-mode editing' : 'sheet-mode';

  // Set type
  curType = entry ? entry.type : 'expense';
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  const typeBtn = document.querySelector(`.type-btn[data-type="${curType}"]`);
  typeBtn.classList.add('active');
  const cls = curType === 'expense' ? 'exp' : 'inc';
  document.getElementById('amt-display').className = `amt-display ${cls}`;
  document.getElementById('save-btn').className    = `nk save ${cls}`;
  document.getElementById('save-btn').textContent  = entry ? '更新' : '確認';

  // Set amount
  amtStr = entry ? String(entry.amount) : '0';
  document.getElementById('amt-display').textContent = amtStr;

  // Set note
  document.getElementById('note-inp').value = entry ? (entry.note || '') : '';

  // Build category grid pre-selecting the right one
  const cats = curType === 'expense' ? EXP_CATS : INC_CATS;
  selCat = entry ? entry.category : cats[0].key;
  buildCatGrid();

  document.getElementById('overlay').classList.add('open');
}

function editEntry(id) {
  const entry = allEntries.find(e => e.id === id);
  if (entry) openSheet(entry);
}

function closeSheet() {
  editingId = null;
  document.getElementById('overlay').classList.remove('open');
}

document.getElementById('fab-btn').addEventListener('click', openSheet);
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeSheet();
});

/* Type toggle */
document.querySelectorAll('.type-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    curType = btn.dataset.type;
    selCat = null;   // force reset so buildCatGrid picks the first valid cat
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const cls = curType === 'expense' ? 'exp' : 'inc';
    document.getElementById('amt-display').className = `amt-display ${cls}`;
    document.getElementById('save-btn').className    = `nk save ${cls}`;
    buildCatGrid();
  });
});

function buildCatGrid() {
  const cats = curType === 'expense' ? EXP_CATS : INC_CATS;
  // Only reset selCat if the current value isn't valid for this type
  if (!cats.find(c => c.key === selCat)) selCat = cats[0].key;
  const cls = curType === 'expense' ? 'exp' : 'inc';
  document.getElementById('cat-grid').innerHTML = cats.map(c => `
    <button class="cat-btn${c.key===selCat?' sel '+cls:''}" data-cat="${c.key}">
      <div class="cat-icon-wrap" style="background:${c.bg}">${c.emoji}</div>
      <span class="cat-name">${c.key}</span>
    </button>`).join('');
  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      selCat = btn.dataset.cat;
      const cls2 = curType==='expense'?'exp':'inc';
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('sel','exp','inc'));
      btn.classList.add('sel', cls2);
    });
  });
}

/* Numpad */
document.querySelectorAll('.nk').forEach(btn => {
  const k = btn.dataset.k;
  if (!k) return;
  btn.addEventListener('click', () => {
    if (k === 'del') {
      amtStr = amtStr.length > 1 ? amtStr.slice(0,-1) : '0';
    } else {
      if (k === '.' && amtStr.includes('.')) return;
      const [, dec] = amtStr.split('.');
      if (dec !== undefined && dec.length >= 2) return;
      amtStr = amtStr === '0' && k !== '.' ? k : amtStr + k;
    }
    document.getElementById('amt-display').textContent = amtStr;
  });
});

document.getElementById('save-btn').addEventListener('click', async () => {
  const amt = parseFloat(amtStr);
  if (!amt || amt <= 0) { alert('請輸入金額'); return; }
  const btn = document.getElementById('save-btn');
  const origLabel = btn.textContent;
  btn.textContent = '…'; btn.disabled = true;
  const data = {
    type: curType, amount: amt,
    category: selCat,
    note: document.getElementById('note-inp').value.trim(),
  };
  try {
    if (editingId) {
      await updateEntry(editingId, data);
    } else {
      await saveEntry({ ...data, date: ymd(viewDate) });
    }
    closeSheet();
  } catch(e) {
    alert('儲存失敗：' + e.message);
  } finally {
    btn.textContent = origLabel; btn.disabled = false;
  }
});

// ─── Date/month nav ───────────────────────────────────────────────────────────
function pickDate(val) {
  if (!val) return;
  viewDate = new Date(val + 'T00:00:00');
  renderToday();
}
function syncPicker() {
  document.getElementById('date-picker').value = ymd(viewDate);
}

document.getElementById('prev-day').addEventListener('click', () => {
  viewDate.setDate(viewDate.getDate()-1); syncPicker(); renderToday();
});
document.getElementById('next-day').addEventListener('click', () => {
  viewDate.setDate(viewDate.getDate()+1); syncPicker(); renderToday();
});
document.getElementById('prev-month').addEventListener('click', () => {
  viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth()-1, 1);
  renderMonthly();
});
document.getElementById('next-month').addEventListener('click', () => {
  viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth()+1, 1);
  renderMonthly();
});

// ─── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab-item,.bnav-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.page').forEach(p =>
    p.classList.toggle('active', p.id === 'tab-'+name));
  if (name === 'monthly') renderMonthly();
  if (name === 'ledger')  renderLedger();
}
document.querySelectorAll('.tab-item,.bnav-btn').forEach(btn =>
  btn.addEventListener('click', () => switchTab(btn.dataset.tab)));

// ─── Delete ───────────────────────────────────────────────────────────────────
async function confirmDel(id) {
  if (!confirm('確定刪除這筆記錄？')) return;
  try { await deleteEntry(id); }
  catch(e) { alert('刪除失敗：' + e.message); }
}

// ─── Init ─────────────────────────────────────────────────────────────────────
buildCatGrid();
syncPicker();
renderToday();
loadAll().then(() => setupRealtime());
</script>
